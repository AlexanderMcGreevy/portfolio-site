<!DOCTYPE html>
<html lang="en" data-stop="home" data-span="1.5">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Climb · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c1915}
html.embedded,html.embedded body{background:transparent}
body{font:14px/1.4 system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}

/* the postcard: full-bleed at p=0, settles flat and centred (slightly lifted) by p=1 for the shell's flip */
#card{position:absolute;inset:0;transform-origin:50% 50%}
.stage{position:absolute;inset:0;overflow:hidden;container-type:size;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:#f3e8cf;
  --f:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--k:1.05;--ls:.05em;
  --ink:#2a2540;--title:#c0392b;--tsh:#2a2540;
  --sgb:#c0392b;--sgf:#fbf5ea;--sge:#2a2540;--exb:#3f6b4f;--exf:#fbf5ea;--exe:#1d3b2c;--post:#2a2540;--focus:#c0392b;
  --bandb:#2a2540;--bandf:#f6dcc0;--tb:#2a2540;--tf:#f6dcc0;--hint:#f08a3c;
  --bf:#8a5a34;--bi:#6a4122;--bm:#d9b98a;--bs:#3f6b4f;--bh:#c0392b;--bb:#fbf5ea;--bo:#2a2540;--bd:#2a2540;--bg:#f6dcc0;
  transition:background-color .8s}
.stage.night{background:#141224;--ink:#ece4cf;--title:#ece4cf;--tsh:#0a0918;
  --sgb:#e9c46a;--sgf:#141224;--sge:#141224;--exb:#163126;--exf:#ece4cf;--exe:#8fbfa0;--post:#0a0918;--focus:#e9c46a;
  --bandb:#0a0918;--bandf:#c9c4dc;--tb:#ece4cf;--tf:#141224;--hint:#efe9f7;--bf:#5a4060;--bi:#3a2a40;--bm:#a9a0c0;--bs:#163126;--bh:#6a2a3a;--bo:#0a0918}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* the lettering is real text */
.head{position:absolute;text-align:center;pointer-events:none;z-index:2}
.head .cap{margin:0;font-family:var(--f);letter-spacing:.32em;text-transform:uppercase;color:var(--ink);transition:color .8s}
.head h1{margin:0;font-family:var(--f);font-weight:400;line-height:.98;letter-spacing:.03em;text-transform:uppercase;color:var(--title);
  text-shadow:.035em .04em 0 var(--tsh);text-wrap:balance;transition:color .8s,text-shadow .8s}
.head .one,.head .why{margin:.55em auto 0;max-width:min(44em,88%);font-family:'Josefin Sans','Avenir Next','Century Gothic',system-ui,sans-serif;font-weight:600;
  line-height:1.35;color:var(--ink);text-wrap:balance;transition:color .8s}
.head .why{margin-top:.3em;opacity:.85}
.head .why:empty,.head .one:empty{display:none}

.band{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;pointer-events:none;z-index:2;
  background:var(--bandb);color:var(--bandf);font-family:var(--f);font-size:var(--bfs);letter-spacing:.22em;text-transform:uppercase;
  border-top:3px solid var(--bandf);border-radius:0 0 14px 14px;transition:background-color .8s,color .8s,border-color .8s}

/* signs */
.sign{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent}
.sign .board{display:block;font-family:var(--f);font-size:max(14px,calc(var(--k,1) * clamp(16px,min(2.7cqw,4.6cqh),42px)));line-height:1.04;letter-spacing:var(--ls,.04em);text-transform:uppercase;
  text-align:center;width:max-content;max-width:10.5em;padding:.42em .7em .48em;text-wrap:balance;
  background:var(--sgb);color:var(--sgf);border:.14em solid var(--sge);border-radius:.18em;box-shadow:inset 0 0 0 .07em var(--sgb),inset 0 0 0 .12em var(--sge);
  transition:background-color .8s,color .8s,border-color .8s,box-shadow .8s,transform .18s ease}
.sign.cue .board{font-size:max(12px,calc(var(--k,1) * .74 * clamp(16px,min(2.7cqw,4.6cqh),42px)));background:var(--exb);color:var(--exf);border-color:var(--exe);
  box-shadow:inset 0 0 0 .07em var(--exb),inset 0 0 0 .12em var(--exf)}
.sign::after{content:"";display:block;width:.9cqmin;min-width:6px;height:clamp(12px,3.2cqh,34px);background:var(--post);transition:background-color .8s}
.sign:hover .board{transform:translateY(-3px) rotate(-.7deg)}
.sign:active .board{transform:translateY(1px)}
.sign:focus-visible{outline:none}
.sign:focus-visible .board{outline:4px solid var(--focus);outline-offset:5px}
.sign.cue{transition:opacity .25s}
.sign.cue .arr{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(.18em)}}
.driving .sign{pointer-events:none;opacity:.78}

/* secret (the sun) */
.secret{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:transparent;border:0;padding:0;cursor:pointer;z-index:4}
.secret:focus-visible{outline:3px dashed var(--focus);outline-offset:5px}

.toast{position:absolute;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:8;padding:.55em 1.1em;border-radius:99px;
  font:600 14px/1.2 system-ui,-apple-system,sans-serif;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;background:var(--tb);color:var(--tf);border:2px solid var(--tf);transition:opacity .35s,transform .35s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* the ranger bear cameo */
.bear{position:absolute;width:clamp(26px,3.3cqw,54px);transform:translate(-50%,-100%);pointer-events:none;z-index:3}
.bear svg{display:block;width:100%;height:auto;overflow:visible;stroke:var(--bo);stroke-width:1.1;stroke-linejoin:round}
.bear .fur{fill:var(--bf)} .bear .inner{fill:var(--bi)} .bear .muzzle{fill:var(--bm)} .bear .shirt{fill:var(--bs)} .bear .hat{fill:var(--bh)} .bear .hband{fill:var(--bb)}
.bear .dark{fill:var(--bd);stroke:none} .bear .badge{fill:var(--bg);stroke-width:.6}
.bear .arm{transform-box:view-box;transform-origin:34px 34px;animation:wave 4.4s ease-in-out infinite}
@keyframes wave{0%,58%,100%{transform:rotate(0)}64%{transform:rotate(-38deg)}70%{transform:rotate(-8deg)}76%{transform:rotate(-38deg)}82%{transform:rotate(-8deg)}90%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.bear .arm,.sign.cue .arr{animation:none}.stage,.stage *,.stage *::after{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="card">
  <div class="stage">
    <canvas aria-hidden="true"></canvas>
    <div class="head"><p class="cap"></p><h1 class="name"></h1><p class="one"></p><p class="why"></p></div>
    <div class="band"></div>
    <div class="bear"></div>
    <button class="sign cue" type="button"><span class="board">Scroll to start the climb <span class="arr" aria-hidden="true">↓</span></span></button>
    <button class="sign classic" type="button"><span class="board">View classic portfolio →</span></button>
    <button class="secret" type="button" aria-pressed="false" aria-label="The sun (secret): switch between day and night print"></button>
    <div class="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="../content.js"></script>
<script src="../bridge.js"></script>
<script>
(()=>{
'use strict';
/* =====================================================================
   THE CLIMB · stop ① HOME · the Grand Hotel postcard (mockup variant I)
   Flat WPA-postcard shapes, a slowly turning sunburst, the funny sun,
   paper grain. The sun is the secret (day print ↔ night print).
   Scroll: gentle drift only; by p=1 the postcard sits flat and centred
   so the shell can flip it over onto the Journey map.
   ===================================================================== */
const CL=window.Climb, PER=(window.CONTENT&&window.CONTENT.person)||{};
if(CL&&CL.embedded) document.documentElement.classList.add('embedded');
const TAU=Math.PI*2, lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t), dip=nt=>Math.sin(Math.PI*nt);
const $=(s,r=document)=>r.querySelector(s);
const RM=window.matchMedia('(prefers-reduced-motion: reduce)');
const DPR=Math.min(1.5,window.devicePixelRatio||1);
const _hc={};
function rgb(h){ if(_hc[h]) return _hc[h]; const n=parseInt(h.slice(1),16); return _hc[h]=[n>>16&255,n>>8&255,n&255]; }
function mix(a,b,t,al){ const A=rgb(a),B=rgb(b),k=al===undefined?1:al; return 'rgba('+((A[0]+(B[0]-A[0])*t)|0)+','+((A[1]+(B[1]-A[1])*t)|0)+','+((A[2]+(B[2]-A[2])*t)|0)+','+k+')'; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function off(w,h){ const c=document.createElement('canvas'); c.width=Math.ceil(w*DPR); c.height=Math.ceil(h*DPR); const x=c.getContext('2d'); x.setTransform(DPR,0,0,DPR,0,0); return [c,x]; }
function grainTile(alpha,size=160){ const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d'); const id=g.createImageData(size,size);
  for(let k=0;k<id.data.length;k+=4){ const v=Math.random()*255|0; id.data[k]=id.data[k+1]=id.data[k+2]=v; id.data[k+3]=alpha; } g.putImageData(id,0,0); return c; }
function poly(c,pts,close=true){ c.beginPath(); for(let i=0;i<pts.length;i++){ if(i) c.lineTo(pts[i][0],pts[i][1]); else c.moveTo(pts[i][0],pts[i][1]); } if(close) c.closePath(); }
function lens(c,x0,y0,x1,y1,wd){ const mx=(x0+x1)/2,my=(y0+y1)/2,dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1,nx=-dy/d*wd,ny=dx/d*wd;
  c.moveTo(x0,y0); c.quadraticCurveTo(mx+nx,my+ny,x1,y1); c.quadraticCurveTo(mx-nx,my-ny,x0,y0); }
function star4(c,x,y,r){ c.moveTo(x,y-r); c.quadraticCurveTo(x,y,x+r,y); c.quadraticCurveTo(x,y,x,y+r); c.quadraticCurveTo(x,y,x-r,y); c.quadraticCurveTo(x,y,x,y-r); }
function textW(font,text,track){ const g=document.createElement('canvas').getContext('2d'); g.font=font; const a=Array.from(text); return a.reduce((s,ch)=>s+g.measureText(ch).width,0)+track*(a.length-1); }
function letterLine(c,text,cx,cy,font,track){ c.font=font; c.textBaseline='middle'; c.textAlign='left';
  const chs=Array.from(text), adv=chs.map(ch=>c.measureText(ch).width), tot=adv.reduce((a,b)=>a+b,0)+track*(chs.length-1); let x=cx-tot/2;
  chs.forEach((ch,i)=>{ c.fillText(ch,x,cy); x+=adv[i]+track; }); }
function arcLine(c,text,cx,cy,R,font,track){ c.font=font; c.textAlign='center'; c.textBaseline='alphabetic';
  const chs=Array.from(text), adv=chs.map(ch=>c.measureText(ch).width), tot=adv.reduce((a,b)=>a+b,0)+track*(chs.length-1); let a=-Math.PI/2-tot/2/R;
  chs.forEach((ch,i)=>{ const ac=a+adv[i]/2/R; c.save(); c.translate(cx+Math.cos(ac)*R,cy+Math.sin(ac)*R); c.rotate(ac+Math.PI/2); c.fillText(ch,0,0); c.restore(); a+=(adv[i]+track)/R; }); }
function rrPath(c,x,y,w,h,r){ c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

/* ---- the Mt. Washington Auto Road: switchbacks up a mountain profile ---- */
function crossings(prof,y){ let xl=Infinity,xr=-Infinity; for(let i=0;i<prof.length-1;i++){ const a=prof[i],b=prof[i+1]; if((a[1]-y)*(b[1]-y)<=0&&a[1]!==b[1]){ const x=a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]); xl=Math.min(xl,x); xr=Math.max(xr,x); } } return [xl,xr]; }
function makeRoad(R){ const V=[R.start.slice()];
  for(let k=1;k<R.n;k++){ const u=k/R.n, y=lerp(R.base,R.top,1-Math.pow(1-u,1.3)), [xl,xr]=crossings(R.prof,y); if(!isFinite(xl)) continue; const wd=xr-xl; const ins=R.inset+(R.inset2||0)*(1-u); V.push([k%2?xr-wd*ins:xl+wd*ins,y]); }
  V.push(R.apex.slice());
  const mp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t], pts=[V[0]];
  for(let i=1;i<V.length-1;i++){ const a=mp(V[i],V[i-1],R.r), b=mp(V[i],V[i+1],R.r); pts.push(a);
    for(let s=1;s<8;s++){ const t=s/8,u=1-t; pts.push([u*u*a[0]+2*u*t*V[i][0]+t*t*b[0],u*u*a[1]+2*u*t*V[i][1]+t*t*b[1]]); } pts.push(b); }
  pts.push(V[V.length-1]);
  const len=[0]; for(let i=1;i<pts.length;i++) len.push(len[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const total=len[len.length-1];
  return {pts,len,total,yBot:R.start[1],yTop:R.apex[1],
    at(u){ const d=clamp(u,0,1)*total; let lo=0,hi=len.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(len[m]<d) lo=m; else hi=m; }
      const a=pts[lo],b=pts[hi],t=(d-len[lo])/((len[hi]-len[lo])||1); return {x:lerp(a[0],b[0],t),y:lerp(a[1],b[1],t),dx:b[0]-a[0],dy:b[1]-a[1]}; }}; }
function strokeRoad(c,road,wBot,wTop,col){ c.lineCap='round'; c.lineJoin='round'; c.strokeStyle=col;
  for(let i=0;i<road.pts.length-1;i++){ const a=road.pts[i],b=road.pts[i+1], f=clamp((a[1]-road.yTop)/(road.yBot-road.yTop),0,1); c.lineWidth=lerp(wTop,wBot,f); c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.stroke(); } }
function dashRoad(c,road,col,lw,dash,gap){ c.save(); c.strokeStyle=col; c.lineWidth=lw; c.lineCap='butt'; c.setLineDash([dash,gap]); poly(c,road.pts,false); c.stroke(); c.restore(); }
function aPine(c,x,base,H,W){ for(let k=0;k<3;k++){ const top=base-H+k*H*.25; c.beginPath(); c.moveTo(x,top); c.lineTo(x+W*(.6+k*.25),top+H*.42); c.lineTo(x-W*(.6+k*.25),top+H*.42); c.closePath(); c.fill(); } c.fillRect(x-W*.08,base-H*.1,W*.16,H*.12); }

/* the ranger bear: an original character in a campaign hat (not named, no slogans) */
const BEAR='<svg viewBox="0 0 44 58" aria-hidden="true" focusable="false">'+
'<ellipse class="fur" cx="15" cy="53" rx="5.2" ry="3.4"/><ellipse class="fur" cx="29" cy="53" rx="5.2" ry="3.4"/>'+
'<ellipse class="fur" cx="22" cy="43" rx="12.5" ry="12"/><path class="shirt" d="M10.2 40.5C11 33.5 33 33.5 33.8 40.5L35 51Q22 55.5 9 51Z"/>'+
'<circle class="badge" cx="27.5" cy="42.5" r="2"/><ellipse class="fur" cx="8.2" cy="42" rx="3.1" ry="6.4" transform="rotate(8 8.2 42)"/>'+
'<g class="arm"><ellipse class="fur" cx="35.8" cy="38.5" rx="3.1" ry="6.4" transform="rotate(-22 35.8 38.5)"/></g>'+
'<circle class="fur" cx="11.6" cy="18.5" r="4.6"/><circle class="fur" cx="32.4" cy="18.5" r="4.6"/><circle class="inner" cx="11.6" cy="18.8" r="2.1" stroke="none"/><circle class="inner" cx="32.4" cy="18.8" r="2.1" stroke="none"/>'+
'<circle class="fur" cx="22" cy="24.5" r="11"/><ellipse class="muzzle" cx="22" cy="28.6" rx="5.6" ry="4.1"/>'+
'<ellipse class="dark" cx="22" cy="26.8" rx="2.2" ry="1.4"/><path d="M19.6 30.6Q22 32.4 24.4 30.6" fill="none" stroke="var(--bd)" stroke-width="1"/>'+
'<circle class="dark" cx="17.4" cy="23.2" r="1.25"/><circle class="dark" cx="26.6" cy="23.2" r="1.25"/>'+
'<ellipse class="hat" cx="22" cy="17.2" rx="15.5" ry="3.3"/><path class="hat" d="M14.6 16.8L16.2 6.4Q22 4 27.8 6.4L29.4 16.8Q22 19.4 14.6 16.8Z"/>'+
'<path class="hband" d="M14.8 14.4Q22 17 29.2 14.4L29.4 16.8Q22 19.4 14.6 16.8Z"/><path d="M17.6 5.6Q22 9.6 26.4 5.6" fill="none" stroke-width=".9"/></svg>';

/* the funny little sun (and its sleepy moon form) */
function sunBody(c,v,x,y,r,o){ const moon=v.nt>.5, col=moon?o.moon:o.sun, fc=moon?(o.mface||o.face):o.face; c.save(); c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.arc(x,y,r,0,TAU); c.fillStyle=col; c.fill(); c.strokeStyle=fc; c.fillStyle=fc; c.lineWidth=Math.max(1.3,r*.09);
  const ex=r*.34, ey=-r*.12, er=Math.max(1.4,r*.11);
  if(!moon){ let dx=0,dy=0; if(v.inside){ const a=Math.atan2(v.my-y,v.mx-x); dx=Math.cos(a)*r*.07; dy=Math.sin(a)*r*.07; } const big=v.hover?1.4:1;
    for(const k of[-1,1]){ c.beginPath(); c.arc(x+k*ex+dx,y+ey+dy,er*big,0,TAU); c.fill(); }
    c.beginPath(); if(v.hover){ c.arc(x,y+r*.25,r*.15,0,TAU); c.fill(); } else { c.arc(x,y+r*.06,r*.32,.18*Math.PI,.82*Math.PI); c.stroke(); } }
  else{ for(const k of[-1,1]){ c.beginPath(); c.arc(x+k*ex,y+ey-er,er*1.5,.15*Math.PI,.85*Math.PI); c.stroke(); }
    c.beginPath(); c.arc(x,y+r*.34,r*.08,0,TAU); c.stroke(); const zt=(v.t*.6)%1; c.globalAlpha=1-zt; c.fillStyle=col; c.font='700 '+Math.max(10,r*.6)+'px system-ui,sans-serif'; c.fillText('z',x+r*.95+zt*r*.5,y-r*.7-zt*r); }
  c.restore(); }
function eCloud(c,X,Y,W,seed,col,colS){ const r=rng(seed), n=6, lobes=[]; for(let i=0;i<n;i++){ const f=(i+.5)/n; lobes.push([X+(f-.5)*W*(.9+r()*.1),W*(.06+.11*Math.sin(f*Math.PI))*(.8+r()*.45)]); }
  for(const [col2,dy] of[[colS,W*.03],[col,0]]){ c.save(); c.beginPath(); c.rect(X-W,Y-W,W*2,W+dy); c.clip(); c.fillStyle=col2; c.beginPath(); for(const [lx,lr] of lobes){ c.moveTo(lx+lr,Y+dy); c.arc(lx,Y+dy,lr,0,TAU); } c.fill(); c.restore(); } }

/* ---- the print: day and night inks ---- */
const DI={paper:'#f3e8cf',sky:'#f7dcc0',ray:'#fae9d2',far:'#bcadcc',farF:'#d8cde2',snow:'#fcf7ec',mtn:'#8b7fae',mtnL:'#a99dc6',mtnD:'#6c6191',forest:'#3f6b4f',meadow:'#a5c26f',meadow2:'#8fb35e',
          hill:'#2f5a40',pine:'#1d3b2c',hotel:'#fcf7ec',hotelS:'#ddcfb6',roof:'#c0392b',win:'#46566a',ink:'#2a2540',road:'#f3e8cf',redge:'#2a2540',mark:'#2a2540',cloud:'#fcf7ec',cloudS:'#efd6c4'};
const NI={paper:'#141224',sky:'#1b1838',ray:'#232050',far:'#2c2a52',farF:'#36346a',snow:'#b8b3d6',mtn:'#262250',mtnL:'#302c62',mtnD:'#1c1940',forest:'#122a22',meadow:'#24402c',meadow2:'#1e3826',
          hill:'#0e2219',pine:'#07140e',hotel:'#c9c4dc',hotelS:'#8f89aa',roof:'#6a2a3a',win:'#f2c86b',ink:'#ece4cf',road:'#9e99b8',redge:'#0a0918',mark:'#c9c4dc',cloud:'#2e2c5a',cloudS:'#25234c'};
const SUN={sun:'#f08a3c',moon:'#efe9f7',face:'#5b2a10',mface:'#2c2a52'};

function pcFar(c,K,L,list,baseF){ const {aw,P,Q}=L; for(const [px,py,hw] of list){ const apx=P(px),apy=Q(py),hwp=hw*aw,base=Q(baseF);
  c.fillStyle=K.far; c.beginPath(); c.moveTo(apx-hwp,base); c.lineTo(apx,apy); c.lineTo(apx+hwp,base); c.closePath(); c.fill();
  c.fillStyle=K.farF; c.beginPath(); c.moveTo(apx,apy); c.lineTo(apx-hwp,base); c.lineTo(apx-hwp*.25,base); c.lineTo(apx-hwp*.04,apy+(base-apy)*.45); c.closePath(); c.fill();

else addEventListener('resize',()=>{ fit(); frame(0); });
if(CL){
  CL.onProgress(p=>{ S.p=p; applyProgress(); S.dirty=true; schedule(); });
  CL.onVisible(v=>{ S.visible=v; if(v) resume(); });
  /* leaving (the shell flips the postcard): fade the cue and freeze the frame; resume if the visitor scrolls back */
  CL.onTransition(({dir,t})=>{ if(dir==='out'){ cueOut=clamp(1-t*4,0,1); S.paused=t>.02; } else { cueOut=1; S.paused=false; } applyProgress(); if(!S.paused){ S.dirty=true; resume(); } });
}
fit(); applyProgress(); frame(0); schedule();
/* the display font arrives from Google Fonts: re-measure the lettering and refit */
if(document.fonts&&document.fonts.load){ Promise.race([Promise.all(['48px "Bebas Neue"','600 16px "Josefin Sans"'].map(f=>document.fonts.load(f,NAME||'A'))),new Promise(r=>setTimeout(r,4000))])
  .then(()=>{ fit(); place(); S.dirty=true; frame(0); }).catch(()=>{}); }
})();
</script>
