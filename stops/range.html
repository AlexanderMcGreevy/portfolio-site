<head>

<link rel="icon" href="data:,">

<style>
/* ⑦ THE RANGE · from mockups/08-diorama-3d.html scene A3 ("The Range, in between") */
:root{--ink:#14231c;--wood:#6b4426;--wood2:#4f3019;--carve:#f3e3c0;--paper:#f7f0dc;--rule:rgba(60,90,140,.22);--red:#ff5a36;--gold:#f6c945}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0e1513;color:#e6f0e8;font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;overflow:clip;background:#9ec3e6;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.over{cursor:pointer}
.sc-ui{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;font:800 11px/1 'Nunito',system-ui,sans-serif;letter-spacing:.04em;color:#fff;background:rgba(15,28,22,.72);padding:4px 7px;border-radius:6px;will-change:transform;pointer-events:none}
.lab::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:8px;background:rgba(255,255,255,.7)}
.lab.big{font-size:12.5px;background:rgba(246,201,69,.95);color:#2a2108}
.lab.big::after{background:var(--gold)}
.lab.pl{background:rgba(24,58,92,.78);font-weight:700;font-size:10.5px}
.lab.pl::after{background:rgba(180,215,255,.8)}
.hit{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border:0;border-radius:50%;background:transparent;pointer-events:none;will-change:transform}
/* trip flags: real buttons pinned over the 3D flag poles */
.flag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:4px;white-space:nowrap;border:0;margin:0;cursor:pointer;
  font:900 11.5px/1 'Nunito',system-ui,sans-serif;letter-spacing:.03em;color:#2a0f06;background:#fffaf0;padding:5px 8px 5px 7px;border-radius:7px;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 2px var(--red);will-change:transform,opacity;pointer-events:auto;transition:background .15s,color .15s}
.flag b{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;font:900 10px/1 'Nunito',sans-serif}
.flag:hover b,.flag:focus-visible b{background:#fff;color:var(--red)}
.flag::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:7px;margin-left:-1px;background:var(--red)}
.flag:hover,.flag:focus-visible{background:var(--red);color:#fff}
.flag[data-off]{pointer-events:none}
/* ---------- the register (contact) ---------- */
#register{position:fixed;z-index:20;right:var(--reg-r,22px);top:50%;width:min(340px,calc(100vw - 32px));transform:translateY(-50%);
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.42));will-change:opacity,transform}
#register[data-off]{pointer-events:none}
.sign{position:relative;margin:0 6px;padding:14px 18px 13px;border-radius:7px 7px 3px 3px;text-align:center;color:var(--carve);
  background:repeating-linear-gradient(176deg,rgba(0,0,0,.0) 0 7px,rgba(0,0,0,.09) 7px 9px,rgba(255,255,255,.03) 9px 13px),linear-gradient(180deg,#7b4f2c,var(--wood) 55%,var(--wood2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.25)}
.sign::before,.sign::after{content:'';position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9d2c4,#6f675c)}
.sign::before{left:8px}.sign::after{right:8px}
.sign .k{display:block;font:500 10.5px/1 'DM Mono',ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;opacity:.78;margin-bottom:6px}
.sign h1{margin:0;font-weight:900;font-size:21px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 -1px 0 rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.12)}
.card{position:relative;margin-top:-2px;padding:15px 18px 14px;border-radius:3px 3px 10px 10px;color:var(--ink);
  background:linear-gradient(90deg,transparent 30px,rgba(214,70,60,.28) 30px 31px,transparent 31px),repeating-linear-gradient(180deg,transparent 0 25px,var(--rule) 25px 26px),var(--paper)}
.card h2{margin:0 0 4px 22px;font-weight:900;font-size:22px;line-height:1.1;color:#1d3a2a}
.card p{margin:0 0 10px 22px;font-weight:700;font-size:14px;line-height:1.4;color:#33463b}
.card ul{list-style:none;margin:0 0 10px;padding:0}
.card li{display:flex;align-items:baseline;gap:10px;min-height:26px;padding-left:22px}
.card li[hidden]{display:none}
.card .lk{flex:0 0 66px;font:500 10.5px/1 'DM Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#6a6a5e}
.card a{color:#163e8c;font:500 13.5px/1.3 'DM Mono',ui-monospace,monospace;text-decoration:none;border-bottom:1.5px solid rgba(22,62,140,.35);overflow-wrap:anywhere}
.card a:hover{color:#c2391d;border-color:#c2391d}
.classic{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 22px);margin:4px 0 0 22px;padding:9px 12px;border:2px solid #1d3a2a;border-radius:9px;background:#1d3a2a;color:#fffaf0;font-weight:900;font-size:14px;cursor:pointer}
.classic:hover{background:#2a5a40}
.trip{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:11px 0 0 22px;font:500 10.5px/1 'DM Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#6a6a5e}
.trip span{flex:0 0 100%;margin-bottom:2px}
.trip button{width:26px;height:26px;padding:0;border:1.5px solid rgba(29,58,42,.45);border-radius:50%;background:transparent;color:#1d3a2a;font:900 13px/1 'Nunito',sans-serif;cursor:pointer}
.trip button:hover,.trip button:focus-visible{background:var(--red);border-color:var(--red);color:#fff}
/* ---------- controls ---------- */
#tools{position:fixed;z-index:21;top:60px;right:14px;display:flex;gap:6px} /* below the shell's top-right nav */
#tools button{border:1px solid rgba(255,255,255,.4);background:rgba(14,28,24,.72);color:#e6f0e8;height:32px;min-width:32px;padding:0 11px;border-radius:999px;cursor:pointer;font-weight:900;font-size:13px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#tools button:hover{background:rgba(14,28,24,.92)}
#tools button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2a2108}
#cue{position:fixed;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);font-weight:800;font-size:13px;letter-spacing:.06em;color:#fff;background:rgba(14,28,24,.62);padding:7px 13px;border-radius:999px;pointer-events:none;white-space:nowrap}
#attr{position:fixed;z-index:4;left:10px;bottom:8px;font:500 10px/1.3 'DM Mono',ui-monospace,monospace;color:rgba(255,255,255,.82);text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.nogl{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#0e1c18;padding:24px;text-align:center}
.nogl[hidden]{display:none}
.nogl div{max-width:420px;font-weight:700;line-height:1.5}
.nogl h2{margin:0 0 8px;color:var(--gold);font-size:20px}
.toast{position:fixed;left:50%;top:58px;transform:translate(-50%,-14px);z-index:100;background:#fffaf0;color:#14231c;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;max-width:min(92vw,520px);font-weight:700}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .t1{font-weight:800}
.toast .t2{display:block;font-weight:600;font-size:12.5px;opacity:.7;margin-top:2px}
.toast button{border:0;background:#14231c;color:#fffaf0;padding:7px 11px;border-radius:9px;cursor:pointer;font-weight:800;white-space:nowrap}
@media (hover:none){#fCam{display:none}}
.climb-embedded{--reg-r:52px}   /* clear the shell's stop-marker column on the right edge */
@media (max-width:700px){
  #register{left:12px;right:12px;top:auto;bottom:12px;width:auto;transform:none}
  .sign{padding:9px 14px 8px}.sign .k{font-size:9.5px;margin-bottom:4px}.sign h1{font-size:17px}
  .card{padding:10px 14px 11px}.card h2{font-size:18px;margin-bottom:2px}.card p{font-size:12.5px;margin-bottom:6px}
  .card li{min-height:23px}.card a{font-size:12.5px}.card .lk{flex-basis:58px}
  .classic{padding:7px 10px;font-size:13px}.trip{margin-top:8px}.trip button{width:24px;height:24px;font-size:12px}
  #attr{bottom:auto;top:8px;right:96px;font-size:9px}
  .flag{padding:4px;gap:0}.flag span{display:none}.flag b{width:17px;height:17px;font-size:11px}
  #cue{bottom:auto;top:56px}
}
@media (max-height:560px) and (min-width:701px){.card p{display:none}.card li{min-height:22px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<body>
<div id="stage">
  <canvas id="gl" aria-label="3D diorama of the Presidential Range from Pierce to Madison, with the route of the climb traced from the Cog Railway base to the summit of Mt. Washington. Drag to look around."></canvas>
  <div id="ui"></div>
  <div class="nogl" id="nogl" hidden><div><h2>WebGL isn't available here</h2><span>The range is a real 3D model, so it needs WebGL. The contact details are right here anyway.</span></div></div>
</div>
<div id="cue" aria-hidden="true">↓ The whole trip</div>
<div id="tools" role="group" aria-label="View controls">
  <button type="button" id="zIn" aria-label="Zoom in">+</button>
  <button type="button" id="zOut" aria-label="Zoom out">−</button>
  <button type="button" id="fCam" aria-pressed="false" title="Free camera: W A S D to move, drag or arrow keys to look, Q / E down and up, Shift to go faster, scroll for speed, Esc to exit">Free cam</button>
</div>
<aside id="register" aria-labelledby="regHead">
  <div class="sign"><span class="k">Summit register</span><h1 id="regName"></h1></div>
  <div class="card">
    <h2 id="regHead"></h2>
    <p id="regLine"></p>
    <ul>
      <li id="rEmail"><span class="lk">Email</span><a></a></li>
      <li id="rGit"><span class="lk">GitHub</span><a target="_blank" rel="noopener"></a></li>
      <li id="rLin"><span class="lk">LinkedIn</span><a target="_blank" rel="noopener"></a></li>
      <li id="rRes"><span class="lk">Resume</span><a target="_blank" rel="noopener">Download PDF</a></li>
    </ul>
    <button type="button" class="classic" id="classic">Classic portfolio <span aria-hidden="true">→</span></button>
    <div class="trip" id="tripRow" role="group" aria-label="The whole trip"><span>The whole trip</span></div>
  </div>
</aside>
<div id="attr">Terrain USGS 3DEP · map data © OpenStreetMap contributors</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- the register: every word from CONTENT; works with or without WebGL ---------- */
const TRIP=[['home','①','Home'],['journey','②','Journey'],['gear','③','Gear'],['trail','④','Trail'],['hut','⑤','Hut'],['summit','⑥','Summit']];
(function(){
  const C=window.CONTENT||{},P=C.person||{},L=C.links||{},K=C.contact||{},q=s=>document.getElementById(s);
  const txt=(el,v)=>{if(v)el.textContent=v;else el.hidden=true};
  txt(q('regName'),P.name);txt(q('regHead'),K.headline);txt(q('regLine'),K.line);
  const bare=u=>u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');
  const link=(id,href,label)=>{const li=q(id),a=li.querySelector('a');if(!href){li.hidden=true;return}a.href=href;if(label)a.textContent=label};
  link('rEmail',L.email&&'mailto:'+L.email,L.email);
  const tail=u=>bare(u).split('/').filter(Boolean).slice(1).join('/')||bare(u);
  link('rGit',L.github,L.github&&tail(L.github));
  link('rLin',L.linkedin,L.linkedin&&tail(L.linkedin));
  link('rRes',L.resume&&(/^(https?:)?\/\//.test(L.resume)||L.resume.charAt(0)==='/'?L.resume:'../'+L.resume));
  q('classic').addEventListener('click',()=>Climb.classic());
  const row=q('tripRow');TRIP.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.textContent=String(i+1);b.title=t[2];b.setAttribute('aria-label',t[1]+' '+t[2]);b.addEventListener('click',()=>Climb.goto(t[0]));row.appendChild(b)});
})();
</script>
<script>
'use strict';
if(typeof THREE==='undefined'){const n=document.getElementById('nogl');if(n){n.hidden=false;n.querySelector('h2').textContent="Three.js didn't load";n.querySelector('div').lastChild.textContent=' These dioramas load Three.js r128 from cdnjs. Check your connection and reload. The live site will bundle it.'}throw new Error('THREE missing');}
/* =====================================================================
   08 · 3D tilt-shift dioramas — Three.js r128 (global build)
   core: utils, noise, geometry helpers, shader patches, terrain, paths,
   people/cars/bear, camera rig, tilt-shift post pass
   ===================================================================== */
const V3=THREE.Vector3, C3=THREE.Color;
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let reduced=false; try{ const mq=matchMedia('(prefers-reduced-motion: reduce)'); reduced=mq.matches; mq.addEventListener&&mq.addEventListener('change',e=>{reduced=e.matches;}); }catch(e){}

function rngMaker(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function hash2(ix,iz,s){let h=Math.imul(ix|0,374761393)^Math.imul(iz|0,668265263)^Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vn(x,z,s){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
  const a=hash2(ix,iz,s),b=hash2(ix+1,iz,s),c=hash2(ix,iz+1,s),d=hash2(ix+1,iz+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,z,o,s){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vn(x*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03}return t/n}
function ridge(x,z,o,s){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){const v=1-Math.abs(2*vn(x*f,z*f,s+i*31)-1);t+=a*v*v;n+=a;a*=.5;f*=2.07}return t/n}
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const hex=h=>{const c=new C3(h);return [c.r,c.g,c.b]};

/* ---------- geometry helpers: coloured, flat-shaded, mergeable ---------- */
const _m4=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _v=new V3(), _s=new V3(), _d=new THREE.Object3D();
function part(geo,col,o){o=o||{};const g=geo.index?geo.toNonIndexed():geo.clone();
  const p=o.p||[0,0,0],r=o.r||[0,0,0],s=o.s||[1,1,1];
  _m4.compose(_v.set(p[0],p[1],p[2]),_q.setFromEuler(_e.set(r[0],r[1],r[2])),_s.set(s[0],s[1],s[2]));
  g.applyMatrix4(_m4);
  const n=g.attributes.position.count,c=new Float32Array(n*3),t=new Float32Array(n).fill(o.tint||0),cc=new C3(col);
  for(let i=0;i<n;i++){c[i*3]=cc.r;c[i*3+1]=cc.g;c[i*3+2]=cc.b}
  const out=new THREE.BufferGeometry();out.setAttribute('position',g.attributes.position);
  out.setAttribute('color',new THREE.BufferAttribute(c,3));out.setAttribute('aTint',new THREE.BufferAttribute(t,1));return out}
function merge(list){let n=0;list.forEach(g=>n+=g.attributes.position.count);
  const P=new Float32Array(n*3),Cc=new Float32Array(n*3),T=new Float32Array(n);let k=0;
  list.forEach(g=>{P.set(g.attributes.position.array,k*3);Cc.set(g.attributes.color.array,k*3);T.set(g.attributes.aTint.array,k);k+=g.attributes.position.count});
  const out=new THREE.BufferGeometry();out.setAttribute('position',new THREE.BufferAttribute(P,3));
  out.setAttribute('color',new THREE.BufferAttribute(Cc,3));out.setAttribute('aTint',new THREE.BufferAttribute(T,1));out.computeVertexNormals();return out}
const BOX=new THREE.BoxGeometry(1,1,1), CYL6=new THREE.CylinderGeometry(1,1,1,6), CYL8=new THREE.CylinderGeometry(1,1,1,8), ICO0=new THREE.IcosahedronGeometry(1,0), ICO1=new THREE.IcosahedronGeometry(1,1);
const box=(col,p,s,o)=>part(BOX,col,Object.assign({p:p,s:s},o||{}));
const cyl=(col,p,s,o)=>part(CYL8,col,Object.assign({p:p,s:s},o||{}));
const ico=(col,p,s,o)=>part(ICO0,col,Object.assign({p:p,s:s},o||{}));
function mesh(geo,mat,sh){const m=new THREE.Mesh(geo,mat);if(sh!==false){m.castShadow=true;m.receiveShadow=true}return m}
const lamb=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
function setM(m,i,x,y,z,ry,s){_d.position.set(x,y,z);_d.rotation.set(0,ry||0,0);const k=s||1;_d.scale.set(k,k,k);_d.updateMatrix();m.setMatrixAt(i,_d.matrix)}
/* basis matrix: model forward = +z, up ~ +y */
const _X=new V3(),_Y=new V3(),_Z=new V3(),_UP=new V3(0,1,0);
function setBasis(m,i,px,py,pz,fx,fy,fz,sc,roll){_Z.set(fx,fy,fz).normalize();_X.crossVectors(_UP,_Z);if(_X.lengthSq()<1e-6)_X.set(1,0,0);_X.normalize();_Y.crossVectors(_Z,_X);
  _m4.makeBasis(_X.multiplyScalar(sc),_Y.multiplyScalar(sc),_Z.multiplyScalar(sc));_m4.setPosition(px,py,pz);m.setMatrixAt(i,_m4)}
function basisObj(o,px,py,pz,fx,fy,fz){_Z.set(fx,fy,fz).normalize();_X.crossVectors(_UP,_Z).normalize();_Y.crossVectors(_Z,_X);
  _m4.makeBasis(_X,_Y,_Z);o.quaternion.setFromRotationMatrix(_m4);o.position.set(px,py,pz)}

/* ---------- material patch: season colour mix, instance tint, cloud shade ---------- */
const CLOUD={n:{value:0},arr:{value:Array.from({length:8},()=>new THREE.Vector4(0,0,0,1))},amt:{value:0.28}};
function patchMat(mat,o){
  const key='pm'+(o.season?'S':'')+(o.inst?'I':'')+(o.cloud?'C':'');
  mat.customProgramCacheKey=()=>key;
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uMix=o.mix||{value:0};sh.uniforms.uCl=CLOUD.arr;sh.uniforms.uClN=CLOUD.n;sh.uniforms.uClAmt=CLOUD.amt;
    let v=sh.vertexShader,f=sh.fragmentShader,d='uniform float uMix;\n';
    if(o.inst)d+='attribute float aTint;\n';
    if(o.season&&!o.inst)d+='attribute vec3 colorB;\n';
    if(o.season&&o.inst)d+='attribute vec3 instColorB;\n';
    if(o.cloud)d+='varying vec3 vWPos;\n';
    v=v.replace('#include <common>','#include <common>\n'+d);
    if(o.inst)v=v.replace('#include <color_vertex>','vColor=color*mix(vec3(1.0),'+(o.season?'mix(instanceColor,instColorB,uMix)':'instanceColor')+',aTint);');
    else if(o.season)v=v.replace('#include <color_vertex>','vColor=mix(color,colorB,uMix);');
    if(o.cloud)v=v.replace('#include <begin_vertex>','#include <begin_vertex>\n{vec4 wp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nwp=instanceMatrix*wp;\n#endif\nwp=modelMatrix*wp;vWPos=wp.xyz;}');
    if(o.cloud){
      f=f.replace('void main() {','varying vec3 vWPos;uniform vec4 uCl[8];uniform float uClN;uniform float uClAmt;\nfloat cloudShade(vec3 p){float s=0.0;for(int i=0;i<8;i++){if(float(i)>=uClN)break;vec4 c=uCl[i];float k=1.0-smoothstep(0.35,1.0,length((p.xz-c.xy)/c.zw));s=max(s,k);}return 1.0-uClAmt*s;}\nvoid main() {');
      f=f.replace('#include <dithering_fragment>','gl_FragColor.rgb*=cloudShade(vWPos);\n#include <dithering_fragment>');
    }
    sh.vertexShader=v;sh.fragmentShader=f;
  };
  return mat;
}

/* ---------- screen-space sky gradient (a high camera never sees a horizon) ---------- */
function makeSky(){

function makePath(ctrl,step,hAt,lift){

    o.x=lerp(this.x[i],this.x[i+1],u);o.z=lerp(this.z[i],this.z[i+1],u);o.y=lerp(this.y[i],this.y[i+1],u);

  this.yaw+=(this.yawT-this.yaw)*k;this.pitch+=(this.pitchT-this.pitch)*k;this.zoom+=(this.zoomT-this.zoom)*k;

'float rot=ign(gl_FragCoord.xy)*6.2831853;vec3 acc=base.rgb;float ws=1.0;\n'+
'for(int i=0;i<32;i++){float fi=float(i);float r=sqrt((fi+.5)/32.)*R;float a=fi*2.39996323+rot;vec2 uv=vUv+vec2(cos(a),sin(a))*r/uRes;\n'+

'c*=uTint*uExp;float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,uSat);c=clamp(c,0.,1.);vec3 s=c*c*(3.-2.*c);c=mix(c,s,uCon);\n'+

try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false,powerPreference:'high-performance'});if(!renderer.getContext())renderer=null}catch(e){renderer=null}
if(renderer){
  ctx.pr=Math.min(window.devicePixelRatio||1,1.5);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0x9ec3e6);renderer.setPixelRatio(ctx.pr);
  post=new Post(renderer);
}else{$('#nogl').hidden=false;$('#tools').hidden=true}
function resize(){if(!renderer)return;W=stage.clientWidth||1;H=stage.clientHeight||1;renderer.setPixelRatio(ctx.pr);renderer.setSize(W,H,false);post.resize(Math.max(2,Math.floor(W*ctx.pr)),Math.max(2,Math.floor(H*ctx.pr)));dirty=3}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else addEventListener('resize',resize);

/* ---------- camera: progress sets the base view, the visitor's drag / zoom ride on top ---------- */
const Q=new URLSearchParams(location.search);
let cfg=null,CLOSE=null,DEF=null;const U={yaw:0,pitch:0,zoom:1},CS={yaw:0,pitch:0,zoom:1,t:new V3()},_tg=new V3();
function setupCam(){cfg=S.rigCfg;const SP=S.summitPt;
  /* the mockup's A3 view looks from the south, where the route hides behind the summit ridge. This stop looks from the
     north-north-west instead (same pitch / fov / tilt-shift), so the climb from the Cog base reads bottom -> top */
  DEF={yaw:3.62,pitch:cfg.pitch,zoom:.9,t:new V3(-6.5,SP[1]-6.3,-11.6)};
  /* dev / screenshot hooks from the mockup: ?zoom= ?pitch= ?yaw= ?look=x,y,z set the settled view */
  if(Q.get('zoom'))DEF.zoom=+Q.get('zoom');if(Q.get('pitch'))DEF.pitch=+Q.get('pitch');if(Q.get('yaw'))DEF.yaw=+Q.get('yaw');
  if(Q.get('look')){const l=Q.get('look').split(',').map(Number);if(l.length===3&&l.every(isFinite))DEF.t.set(l[0],l[1],l[2])}
  /* close on the summit cone, roughly where the summit stop leaves the visitor */
  CLOSE={yaw:DEF.yaw-.35,pitch:.6,zoom:.09,t:new V3(SP[0]-.4,SP[1]-.3,SP[2]+.2)};
  goal(P,true)}
function goal(p,snap){const t=ease(clamp(p/.35,0,1)),s=sstep(.35,1,p);
  const g={yaw:lerp(CLOSE.yaw,DEF.yaw,t)+s*.1+U.yaw,pitch:clamp(lerp(CLOSE.pitch,DEF.pitch,t)+U.pitch,cfg.pMin,cfg.pMax),
    zoom:clamp(Math.exp(lerp(Math.log(CLOSE.zoom),Math.log(DEF.zoom),t))*U.zoom,.05,1.3)};
  _tg.copy(CLOSE.t).lerp(DEF.t,t);
  if(snap){CS.yaw=g.yaw;CS.pitch=g.pitch;CS.zoom=g.zoom;CS.t.copy(_tg)}
  return g}
function camUpdate(dt){const g=goal(P,false),k=reduced?1:1-Math.exp(-dt*7);
  CS.yaw+=(g.yaw-CS.yaw)*k;CS.pitch+=(g.pitch-CS.pitch)*k;CS.zoom*=Math.exp((Math.log(g.zoom)-Math.log(CS.zoom))*k);CS.t.lerp(_tg,k);
  const moving=Math.abs(g.yaw-CS.yaw)>2e-4||Math.abs(g.pitch-CS.pitch)>2e-4||Math.abs(Math.log(g.zoom/CS.zoom))>2e-4||CS.t.distanceToSquared(_tg)>1e-6;
  const a=W/H,dr=reduced?0:Math.sin(simT*.085)*cfg.drift,dp=reduced?0:Math.sin(simT*.06+1.3)*cfg.drift*.4;
  /* phone: the register covers the lower half, so push the diorama up (view offset) and come in closer on the route.
     wider: the register sits on the right, so slide the view left to centre the route in the free space */
  const pt=ease(clamp(P/.35,0,1)),nt=W<=700?pt:0,ox=W>700?Math.min(190,W*.17)*pt:0;
  const yaw=CS.yaw+dr,pitch=clamp(CS.pitch+dp,cfg.pMin,cfg.pMax),dist=cfg.dist*CS.zoom*Math.max(1,cfg.fitAsp/a)*(1+.09*clamp(cfg.fitAsp-a,0,1))*(1-.6*nt);
  cam.fov=cfg.fov;cam.aspect=a;if(nt>0||ox>0)cam.setViewOffset(W,H,ox,H*.19*nt,W,H);else cam.clearViewOffset();F.pos=.5-.19*nt;
  cam.position.set(CS.t.x+dist*Math.sin(yaw)*Math.cos(pitch),CS.t.y+dist*Math.sin(pitch),CS.t.z+dist*Math.cos(yaw)*Math.cos(pitch));
  cam.lookAt(CS.t);cam.updateMatrixWorld();return moving}
function userDrag(dx,dy){U.yaw=clamp(U.yaw-dx*.0055,-cfg.yawR,cfg.yawR);U.pitch=clamp(U.pitch+dy*.0042,-.7,.4);dirty=3}
function userZoom(dy){U.zoom=clamp(U.zoom*Math.exp(dy*.0012),cfg.zMin||.1,1.22);dirty=3}

/* ---------- progress ---------- */
function applyProgress(p){P=p;
  F.amt=sstep(.04,.35,p);
  const r=sstep(.24,.33,p);regEl.style.opacity=r.toFixed(3);regEl.style.transform=(innerWidth<=700?'':'translateY(-50%) ')+'translateY('+((1-r)*14).toFixed(1)+'px)';
  if(r<.05){regEl.setAttribute('data-off','');regEl.inert=true}else{regEl.removeAttribute('data-off');regEl.inert=false}
  cueEl.style.opacity=(1-sstep(.02,.12,p)).toFixed(3);
  if(S)S.setTrip(sstep(.08,.36,p));
  dirty=3}
Climb.onProgress(p=>applyProgress(p));
addEventListener('resize',()=>applyProgress(P));
Climb.anchors({contact:.42,trip:.42});

/* ---------- free camera: fly anywhere (Climb.ownWheel while it is on) ---------- */
const FC={on:false,pos:new V3(),yaw:0,pitch:0,keys:{},mul:1},_fd=new V3();
function fcSet(on){if(!S)return;FC.on=on;Climb.ownWheel=on;const b=$('#fCam');b.setAttribute('aria-pressed',on);b.textContent=on?'Free cam: on':'Free cam';
  if(on){cam.getWorldDirection(_fd);FC.pos.copy(cam.position);FC.yaw=Math.atan2(_fd.x,_fd.z);FC.pitch=Math.asin(clamp(_fd.y,-1,1));FC.keys={};FC.mul=1;
    toast('Free camera','W A S D to fly, drag or arrow keys to look, Q / E down and up, Shift for speed, scroll to change speed, Esc to exit.')}
  dirty=3}
$('#fCam').addEventListener('click',()=>fcSet(!FC.on));
const FCK={w:1,a:1,s:1,d:1,q:1,e:1,' ':1,shift:1,arrowleft:1,arrowright:1,arrowup:1,arrowdown:1};
function fcUpdate(dt){const k=FC.keys,g=S.ground||(()=>0),ext=S.extent||[100,100];
  const turn=1.6*dt;if(k.arrowleft)FC.yaw+=turn;if(k.arrowright)FC.yaw-=turn;if(k.arrowup)FC.pitch+=turn*.7;if(k.arrowdown)FC.pitch-=turn*.7;FC.pitch=clamp(FC.pitch,-1.5,1.5);
  const cp=Math.cos(FC.pitch),fx=Math.sin(FC.yaw)*cp,fy=Math.sin(FC.pitch),fz=Math.cos(FC.yaw)*cp,rx=-Math.cos(FC.yaw),rz=Math.sin(FC.yaw);
  const ground=g(clamp(FC.pos.x,-ext[0]/2,ext[0]/2),clamp(FC.pos.z,-ext[1]/2,ext[1]/2)),agl=Math.max(0,FC.pos.y-ground);
  const sp=clamp(.8+agl*.9,.8,30)*FC.mul*(k.shift?3:1)*dt;let mx=0,my=0,mz=0;
  if(k.w){mx+=fx;my+=fy;mz+=fz}if(k.s){mx-=fx;my-=fy;mz-=fz}if(k.d){mx+=rx;mz+=rz}if(k.a){mx-=rx;mz-=rz}if(k.e||k[' '])my+=1;if(k.q)my-=1;
  FC.pos.x+=mx*sp;FC.pos.y+=my*sp;FC.pos.z+=mz*sp;
  const bx=ext[0]*.75,bz=ext[1]*.75;FC.pos.x=clamp(FC.pos.x,-bx,bx);FC.pos.z=clamp(FC.pos.z,-bz,bz);FC.pos.y=clamp(FC.pos.y,g(clamp(FC.pos.x,-ext[0]/2,ext[0]/2),clamp(FC.pos.z,-ext[1]/2,ext[1]/2))+.06,140);
  cam.fov=52;cam.aspect=W/H;cam.clearViewOffset();F.pos=.5;cam.position.copy(FC.pos);cam.lookAt(FC.pos.x+fx,FC.pos.y+fy,FC.pos.z+fz);cam.updateMatrixWorld();
  if(mx||my||mz||k.arrowleft||k.arrowright||k.arrowup||k.arrowdown)dirty=3}
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(FC.keys[k])FC.keys[k]=0});
addEventListener('blur',()=>{FC.keys={}});

/* ---------- input: orbit (mouse), sideways orbit + pinch (touch), pick ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),touches=new Map();let pinch=0;
function pickAt(e){if(!S||!S.pickables.length)return null;const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
  const hs=ray.intersectObjects(S.pickables,false);if(!hs.length)return null;let o=hs[0].object;while(o&&!o.userData.pick)o=o.parent;return o}
const pDist=()=>{const a=[...touches.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
canvas.addEventListener('pointerdown',e=>{if(!S)return;try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(e.pointerType==='touch'){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){pinch=pDist();drag=null;return}}
  drag={x:e.clientX,y:e.clientY,moved:0,obj:pickAt(e),touch:e.pointerType==='touch'};canvas.classList.add('drag')});
canvas.addEventListener('pointermove',e=>{if(!S)return;
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(touches.size===2){const d=pDist();if(pinch&&d>0)userZoom(-Math.log(d/pinch)/.0012);pinch=d;return}}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=Math.abs(dx)+Math.abs(dy);
    if(FC.on){FC.yaw-=dx*.0045;FC.pitch=clamp(FC.pitch-dy*.0045,-1.5,1.5)}else userDrag(dx,drag.touch?0:dy);dirty=3}  /* touch: vertical drag scrolls the trip (bridge) */
  else if(e.pointerType==='mouse')canvas.classList.toggle('over',!!pickAt(e))});
function endDrag(e){touches.delete(e.pointerId);if(touches.size<2)pinch=0;if(!drag||!S)return;const d=drag;drag=null;canvas.classList.remove('drag');
  if(d.moved<6&&d.obj&&e.type==='pointerup')S.pick(d.obj.userData.pick);dirty=3}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
/* plain wheel goes to the shell via bridge (scroll back up the trip); ctrl+wheel / trackpad pinch zooms; in free cam the wheel sets speed */
canvas.addEventListener('wheel',e=>{if(!S)return;const dy=e.deltaY*(e.deltaMode===1?16:1);
  if(FC.on){e.preventDefault();FC.mul=clamp(FC.mul*Math.exp(-dy*.0015),.15,6);dirty=3}
  else if(e.ctrlKey){e.preventDefault();userZoom(dy*2.5)}},{passive:false});
$('#zIn').addEventListener('click',()=>{if(FC.on)FC.mul=clamp(FC.mul*1.4,.15,6);else userZoom(-260)});
$('#zOut').addEventListener('click',()=>{if(FC.on)FC.mul=clamp(FC.mul/1.4,.15,6);else userZoom(260)});
addEventListener('keydown',e=>{if(!S)return;const tg=e.target;if(tg&&/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;
  const k=e.key.toLowerCase();
  if(FC.on){if(k==='escape'){fcSet(false);return}if(FCK[k]&&!(tg&&/BUTTON|A/.test(tg.tagName)&&k===' ')){FC.keys[k]=1;e.preventDefault();dirty=3}return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(tg===document.body||tg===canvas){if(k==='arrowleft')userDrag(-30,0);else if(k==='arrowright')userDrag(30,0);else if(k==='+'||k==='=')userZoom(-260);else if(k==='-'||k==='_')userZoom(260)}});

/* ---------- loop (only while visible) ---------- */
const pv=new V3();
function proj(el,v,isLab){pv.copy(v).project(cam);const x=(pv.x*.5+.5)*W,y=(-pv.y*.5+.5)*H,vis=pv.z<1&&x>-40&&x<W+40&&y>-40&&y<H+40;
  el.style.display=vis?'':'none';if(vis)el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)'+(isLab?' translate(-50%,-100%)':'');return vis}
let last=performance.now();
function frame(now){if(!running)return;raf=requestAnimationFrame(frame);
  if(!renderer||!S)return;
  const rdt=Math.min(.3,Math.max(0,(now-last)/1000));last=now;
  const dt=reduced?0:Math.min(rdt,.05);
  if(reduced&&dirty<=0&&!FC.on&&!S.busy())return;
  simT+=dt;S.update(dt,simT,rdt);
  let moving=false;if(FC.on)fcUpdate(rdt);else moving=camUpdate(rdt);
  S.hits.forEach(h=>proj(h.el,h.v,false));S.labels.forEach(h=>proj(h.el,h.v,true));
  S.flags.forEach(f=>{if(f.k<.02){f.el.style.display='none';return}if(proj(f.el,f.v,false))f.el.style.transform+=' translate(-50%,-100%) scale('+(.6+.4*f.k).toFixed(3)+')';f.el.style.opacity=f.k.toFixed(3)});
  post.render(S.scene,cam,F,S.grade);
  if(dirty>0)dirty--;if(moving)dirty=Math.max(dirty,1);
}
function start(){if(running||!S)return;running=true;last=performance.now();dirty=3;raf=requestAnimationFrame(frame)}
function stop(){running=false;cancelAnimationFrame(raf)}
function build(){if(S||!renderer)return;
  try{S=sceneA3(ctx)}catch(e){console.error(e&&e.stack||e);$('#nogl').hidden=false;$('#tools').hidden=true;return}
  resize();setupCam();applyProgress(P);
  if(Q.get('t'))simT=+Q.get('t');
  if(Q.get('jump'))S.jump(+Q.get('jump'));
  if(Q.get('act'))setTimeout(()=>Q.get('act').split(',').forEach((a,i)=>setTimeout(()=>S&&S.pick(a),i*60)),400);
  if(Q.get('blur')==='off')F.on=false;
  window.__dio={pick:n=>S&&S.pick(n),F:F,U:U,S:()=>S};
  if(Climb.visible!==false)start()}
Climb.onVisible(v=>{if(v){if(!S)build();else start()}else stop()});
/* defer the heavy build a tick so a shell that preloads us hidden can say so first */
setTimeout(()=>{if(Climb.visible!==false)build()},30);
/* dev hook for screenshots: ?p=0.5 sets progress as the shell would */
if(Q.get('p'))window.postMessage({climb:1,type:'progress',p:+Q.get('p')},'*');
</script>
</body>
</html>
