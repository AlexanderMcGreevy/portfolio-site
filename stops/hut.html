<!doctype html>
<html lang="en" data-stop="hut" data-span="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hut</title>
<!-- ⑤ The Hut: a cozy mountain hut as a pixel-art diorama (built from mockup 05-hut.html, variant G "Pixel HD").
     Content: CONTENT.hut only (each entry = one object in the room). Secret: blow out the lantern → candlelight + ranger bear. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.5 'Space Mono',ui-monospace,monospace}
button{font:inherit;color:inherit}
#wrap{position:fixed;inset:0;display:flex}
#room{position:relative;flex:1;min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#22140c,#0c0705 75%)}
#frame{position:relative;width:min(100%,calc(100vh * 1.3106));width:min(100%,calc(100dvh * 1.3106));aspect-ratio:616/470;overflow:hidden;box-shadow:0 0 0 4px var(--edge),0 0 0 8px #0c0910}
#frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:pan-y}
.hs{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:0;padding:0;background:none;border-radius:50%;outline:none;pointer-events:none;opacity:0}
.hs:focus-visible{opacity:1;outline:3px dashed #ffe08a}
/* object card (shown on hover / tap) */
#card{position:absolute;left:3%;bottom:4%;max-width:min(360px,70%);padding:12px 14px;background:var(--panel);border:4px solid var(--ink);box-shadow:0 0 0 4px #5a331c,6px 6px 0 4px rgba(0,0,0,.4);
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#card.on{opacity:1;transform:none}
#card small{display:block;font:400 8px/1.6 'Press Start 2P',monospace;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
#card b{display:block;margin:4px 0 6px;font:400 12px/1.5 'Press Start 2P',monospace;color:var(--rust)}
#card span{display:block;font-size:13px;line-height:1.5}
#note{position:absolute;left:50%;top:4%;transform:translate(-50%,-6px);padding:7px 12px;background:var(--panel);border:3px solid var(--amber);font:400 9px/1.6 'Press Start 2P',monospace;color:var(--amber);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#note.on{opacity:1;transform:translate(-50%,0)}

#key{flex:none;width:300px;overflow-y:auto;overscroll-behavior:contain;padding:calc(22px + var(--nav-h,0px)) 18px 28px;background:var(--panel);border-left:4px solid var(--edge);scrollbar-width:thin;scrollbar-color:#5a331c transparent}
#key h2{margin:0 0 4px;font:400 11px/1.6 'Press Start 2P',monospace;color:var(--amber)}
#key p.sub{margin:0 0 14px;color:var(--ink2);font-size:12px}
#key ul{list-style:none;margin:0;padding:0}
#key li{margin:0 0 8px}
#key .it{display:block;width:100%;text-align:left;padding:9px 10px 10px;background:transparent;border:2px solid transparent;border-bottom:2px dotted #5a331c;cursor:pointer}
#key .it:hover,#key .it:focus-visible,#key .it.on{border:2px solid var(--amber);background:#24150c;outline:none}
#key .it .o{display:block;font:400 7px/1.6 'Press Start 2P',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
#key .it b{display:block;margin:3px 0 3px;font:400 10px/1.5 'Press Start 2P',monospace;color:var(--rust)}
#key .it .t{display:block;font-size:12.5px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-aspect-ratio:1/1){

  #room{flex:none}
  #frame{width:100vw}
  #key{width:auto;flex:1;border-left:0;border-top:4px solid var(--edge);padding:16px 14px 24px}
  #card{left:2%;bottom:3%;max-width:80%;padding:8px 10px}
  #card span{font-size:12px}
}
@media (prefers-reduced-motion:reduce){#card,#note{transition:none}}
</style>
<script src="../content.js"></script>
<script src="../bridge.js"></script>

</div>

function flash(msg) { note.textContent = msg; note.classList.add('on'); clearTimeout(noteT); noteT = setTimeout(() => note.classList.remove('on'), 2600); }
function setHover(id, fromKey) {
  if (H.st.hover === id) return;
  H.st.hover = id; cv.style.cursor = id ? 'pointer' : 'default';
  Object.keys(items).forEach(k => items[k].classList.toggle('on', k === id));
  if (id) { showCard(id); if (!fromKey && items[id] && items[id].scrollIntoView) items[id].scrollIntoView({ block: 'nearest' }); } else hideCard();
}

/* the readable key: every hut entry, in content order */
HUT.forEach(e => {
  const li = document.createElement('li'), b = document.createElement('button'), sid = sceneId(e.id);
  b.className = 'it'; b.type = 'button'; b.dataset.id = sid;
  const add = (tag, cls, txt) => { if (!txt) return; const n = document.createElement(tag); if (cls) n.className = cls; n.textContent = txt; b.appendChild(n); };
  add('span', 'o', e.object && e.object !== e.title ? e.object : ''); add('b', '', e.title); add('span', 't', e.text);
  b.addEventListener('mouseenter', () => setHover(sid, true)); b.addEventListener('focus', () => setHover(sid, true));
  b.addEventListener('mouseleave', () => setHover(null)); b.addEventListener('blur', () => setHover(null));
  b.addEventListener('click', () => act(sid));
  li.appendChild(b); keyList.appendChild(li); items[sid] = b;
});
/* keyboard / screen-reader hotspots over the canvas */
H.ORD.forEach(id => {
  if (!entryOf(id) && !UI[id]) return;               // object without content: decoration only
  const d = document.createElement('button'); d.type = 'button'; d.className = 'hs'; d.setAttribute('aria-label', LABEL(id)); frameEl.appendChild(d); btns[id] = d;
  d.addEventListener('click', e => { e.stopPropagation(); act(id); });
  d.addEventListener('focus', () => setHover(id)); d.addEventListener('blur', () => setHover(null));
});
const live = id => !!btns[id];
function toV(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H0]; }
function pick(e) { const id = H.pick(toV(e)); return id && live(id) ? id : null; }
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') setHover(pick(e)); });
cv.addEventListener('pointerleave', () => setHover(null));
cv.addEventListener('click', e => { const id = pick(e); if (id) act(id); });

/* ---- actions ---- */
function showBear(pose) { clearTimeout(S.bearOut); S.bear = pose; H.bear(pose); Aud.pop(); S.bearOut = setTimeout(hideBear, pose === 'thumb' ? 7500 : 5600); }
function hideBear() { clearTimeout(S.bearOut); if (!S.bear) return; S.bear = null; H.bearHide(); }
function toggleLantern() {
  S.lit = !S.lit; H.lit(S.lit, false); clearTimeout(S.bearIn);
  if (!S.lit) {
    Aud.puff(); flash('Lantern out · candlelight');
    if (window.Climb) Climb.patch('lantern');
    S.bearIn = setTimeout(() => { if (!S.lit) showBear('thumb'); }, RM ? 250 : 1000);
  } else { Aud.tok(); hideBear(); flash('Lantern lit'); }
}
function act(id) {
  S.idleAt = performance.now();
  if (id === 'lantern') { toggleLantern(); showCard(id, true); return; }
  if (id === 'stove') { S.flare = 1; S.fireTarget = 1; S.bucketDone = false; Aud.crackle(); H.fx(id); showCard(id, true); return; }
  ({ guitar: () => Aud.strum(), mead: () => Aud.bloop(), sabre: () => Aud.ting(), boot: () => Aud.thud(), photo: () => Aud.tok(), log: () => Aud.page(), firstaid: () => Aud.tok() }[id] || (() => Aud.tok()))();
  H.fx(id); showCard(id, true);
}

/* ---- render loop (only while visible) ---- */
let raf = 0, running = false, last = 0, skip = false, lastChk = 0, ready = false;
function place() {
  for (const id in btns) {
    const h = H.HIT[id], b = btns[id]; if (!h) { b.hidden = true; continue; }
    let sx = 0, sy = 0; h.forEach(p => { sx += p[0]; sy += p[1]; }); sx /= h.length; sy /= h.length;
    const inside = sx > 4 && sx < W - 4 && sy > 4 && sy < H0 - 4; b.hidden = !inside;
    b.style.left = (sx / W * 100).toFixed(2) + '%'; b.style.top = (sy / H0 * 100).toFixed(2) + '%';
  }
}
function render(rt) {
  octx.setTransform(1, 0, 0, 1, 0, 0); H.draw(octx, rt);
  quantize(octx.getImageData(0, 0, W, H0), outImg); ctx.putImageData(outImg, 0, 0); place();
}
function update(dt, ts) {
  S.flare = Math.max(0, S.flare - dt * .55); S.fire += (S.fireTarget - S.fire) * Math.min(1, dt * 1.4);
  if (ts - lastChk > 1000) {
    lastChk = ts;
    if (!S.bear && !S.bucketDone && performance.now() - S.idleAt > 25000) { S.bucketDone = true; S.fireTarget = .38; showBear('bucket'); }
  }
  const p = window.Climb ? Climb.progress : 0, e = easeIO(p);
  const tx = lerp(CAM0[0], CAM1[0], e), ty = lerp(CAM0[1], CAM1[1], e), k = RM || snap ? 1 : Math.min(1, dt * 4); snap = false;
  camX += (tx - camX) * k; camY += (ty - camY) * k; H.cam[0] = Math.round(camX); H.cam[1] = Math.round(camY);
  H.st.door = clamp((p - .55) / .3, 0, 1); H.st.fog = clamp((p - .68) / .32, 0, 1); H.st.drift = p;
  H.step(dt, ts / 1000);
}
function loop(ts) {
  if (!running) return;
  raf = requestAnimationFrame(loop);
  const dt = Math.min(.05, Math.max(0, (ts - last) / 1000)); last = ts;
  if (document.hidden) return;
  update(dt, ts);
  if ((skip = !skip)) return;            // ~30 fps is plenty for pixel art and halves the cost
  render(ts / 1000);
}
function start() {
  if (running) return;
  if (!ready) { buildLUT(); H.lit(true, true); ready = true; update(0, performance.now()); render(performance.now() / 1000); }
  running = true; last = performance.now(); raf = requestAnimationFrame(loop);
}
function stop() { running = false; cancelAnimationFrame(raf); }
if (window.Climb) {
  Climb.onVisible(v => { if (v) { S.idleAt = performance.now(); start(); } else { stop(); hideBear(); } });
  Climb.onProgress((p, dp) => { if (Math.abs(dp) > .2) snap = true; if (ready && !running) { update(0, performance.now()); render(performance.now() / 1000); } });
}
if (window.Climb) Climb.anchors({ entry: 0, dining: .45, backdoor: 1 });
if (!window.Climb || Climb.visible) start();
</script>
