<!DOCTYPE html>
<html lang="en" data-stop="summit" data-span="3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Climb · The Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#ffcf5c;--ink:#fff3e4;--panel:rgba(14,10,18,.6)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#1a1420;color:var(--ink);font:14px/1.45 Archivo,Inter,system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas.gl{touch-action:none;cursor:grab}
body.grabbing canvas.gl{cursor:grabbing}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ui{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}
.ui>*{pointer-events:auto}
.fog{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#f4f2ee,#e3e2df 70%,#d6d6d4);opacity:0;z-index:20;will-change:opacity}   /* own layer: fading it never repaints the page */
.title{position:absolute;left:clamp(16px,3vw,44px);top:clamp(14px,3.4vh,36px);max-width:min(780px,58%);pointer-events:none;z-index:5}
.eyebrow{font:400 10.5px 'Space Mono',monospace;letter-spacing:.22em;margin:0 0 8px;opacity:.9;text-transform:uppercase}
.title h1{font:800 clamp(30px,4.6vw,66px)/.92 Archivo,sans-serif;margin:0;letter-spacing:-.035em;text-shadow:0 2px 28px rgba(0,0,0,.45)}
.title .sub{margin:10px 0 6px;font:600 clamp(13px,1.3vw,17px) Archivo,sans-serif;color:var(--accent);letter-spacing:.02em}
.title .look{margin:0;font:400 12px/1.55 'Space Mono',monospace;opacity:.92;max-width:430px;text-shadow:0 1px 8px rgba(0,0,0,.75)}
.goals{position:absolute;left:clamp(16px,3vw,44px);top:calc(clamp(14px,3.4vh,36px) + clamp(150px,19vw,230px));display:flex;flex-direction:column;gap:6px;z-index:6;margin:0;padding:0;list-style:none}
.goals button{display:flex;gap:9px;align-items:center;background:rgba(14,10,18,.42);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;font:600 12px Archivo,sans-serif;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:left}
.goals button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#16121a;font:800 11px Archivo,sans-serif;flex:none}
.goals button em{font-style:normal;opacity:.7;font:400 10px 'Space Mono',monospace;margin-left:2px}
.goals button:hover,.goals button.on{border-color:var(--accent);background:rgba(14,10,18,.66)}
.pk{position:absolute;left:0;top:0;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;z-index:6;will-change:transform}
.pk.off{opacity:0;pointer-events:none}
.pk .dot{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.3),0 0 16px var(--accent)}
.pk .dot::after{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:54px;margin-left:-1px;background:linear-gradient(to top,var(--accent),rgba(255,255,255,.85))}
.pk .lab{position:absolute;left:0;bottom:62px;translate:-50% 0;white-space:nowrap;font:800 13px/1 Archivo,sans-serif;color:#16121a;background:var(--accent);padding:6px 11px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:background .2s,transform .2s}
.pk .pn{position:absolute;left:0;bottom:91px;translate:-50% 0;white-space:nowrap;font:400 9.5px 'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.85);pointer-events:none}
.pk:hover .lab,.pk:focus-visible .lab,.pk.on .lab{background:#fff;transform:translateY(-2px)}
.tags{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tags span{position:absolute;left:0;top:0;white-space:nowrap;font:400 10px 'Space Mono',monospace;letter-spacing:.06em;text-shadow:0 1px 5px rgba(0,0,0,.9);translate:-50% -100%;padding-bottom:5px;will-change:transform}
.tags span::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:4px;background:var(--ink);opacity:.8}
.tags span.ft{font-style:italic;opacity:.85}
.tags span.st{font:600 10px Archivo,sans-serif;letter-spacing:.04em;opacity:.92}
.card{position:absolute;right:clamp(12px,2.2vw,32px);top:calc(clamp(16px,4vh,40px) + var(--nav-h,0px));width:min(340px,34%);background:rgba(14,10,18,.66);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:15px 17px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none;z-index:8}
.card.open{opacity:1;transform:none;pointer-events:auto}
.card .k{margin:0 0 5px;font:400 10px 'Space Mono',monospace;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.card h2{margin:0 0 4px;font:800 26px/1.02 Archivo,sans-serif;letter-spacing:-.02em}
.card .where{margin:0 0 8px;font:400 10.5px 'Space Mono',monospace;opacity:.78}
.card .t{margin:0;font:400 14px/1.55 Archivo,sans-serif}
.rose{position:absolute;left:clamp(12px,2.2vw,32px);bottom:clamp(12px,2.6vh,26px);width:clamp(120px,11vw,156px);aspect-ratio:1;z-index:7}
.rose svg{width:100%;height:100%;display:block;overflow:visible}
.rose .rg{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:1.5px solid #16121a;background:var(--accent);color:#16121a;font:800 11px/1 Archivo,sans-serif;cursor:pointer;padding:0}
.rose .rg:hover,.rose .rg.on{background:#fff}
.face{position:absolute;left:calc(clamp(12px,2.2vw,32px) + clamp(120px,11vw,156px) + 14px);bottom:clamp(14px,2.8vh,30px);z-index:7;pointer-events:none;margin:0;background:rgba(14,10,18,.42);padding:7px 11px;border-radius:10px;font:400 10.5px/1.5 'Space Mono',monospace;letter-spacing:.05em;text-shadow:0 1px 6px rgba(0,0,0,.8);max-width:min(320px,30%);font-variant-numeric:tabular-nums}
.sketch{position:absolute;left:calc(clamp(12px,2.2vw,32px) + clamp(120px,11vw,156px) + 14px);bottom:calc(clamp(14px,2.8vh,30px) + 64px);z-index:8;display:flex;align-items:center;gap:7px;
  background:rgba(14,10,18,.42);color:#f4ecdc;border:1px solid rgba(244,236,220,.35);border-radius:99px;padding:5px 12px 5px 9px;font:700 10.5px/1 'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.sketch:hover{background:rgba(14,10,18,.6)}
.sketch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sketch i{font-style:normal;font-size:14px}
.sketch[aria-pressed=true]{background:#f4ecdc;color:#2b2620;text-shadow:none;border-color:#2b2620}
body.sk canvas.sky{filter:saturate(.7)}
/* blending to or from a neighbour stop: the overlays wait (fading them over a live 3D layer cost ~10 fps), then fade in once
   you've arrived. Pulling back to the range the fog goes too, so the shrinking frame is just the two canvases */
body.in .ui,body.in .tags,body.out .ui,body.out .tags,body.out .fog,body.out #toast{visibility:hidden}
@keyframes uin{from{opacity:0}}
body:not(.in):not(.out) .ui,body:not(.in):not(.out) .tags{animation:uin .45s ease}
.face b{display:block;font:800 21px/1.05 Archivo,sans-serif;letter-spacing:-.01em;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:30;background:rgba(10,12,18,.9);color:#fff;border:1px solid var(--accent);border-radius:12px;padding:10px 16px;font:500 13px/1.4 Archivo,sans-serif;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;max-width:min(520px,92vw);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--accent)}
/* the anemometer: a real button over the 3D instrument (the cups you see are 3D) */
.anem{position:absolute;left:0;top:0;width:58px;height:66px;z-index:9;padding:0;border:0;background:none;cursor:grab;touch-action:none;border-radius:50%;transition:opacity .2s}
.anem.drag{cursor:grabbing}
.anem .mph{position:absolute;left:100%;top:22%;transform:translate(4px,-50%);white-space:nowrap;font:700 10px 'Space Mono',monospace;color:#fff;background:rgba(0,0,0,.45);padding:3px 6px;border-radius:99px;pointer-events:none}
.anem .mph.rec{color:#ff8a6a}
/* ranger bear cameo (original character, campaign hat, holds it on in the wind) */
.bear{position:absolute;right:clamp(12px,2.6vw,36px);bottom:clamp(4px,1.4vh,14px);width:clamp(62px,6.4vw,96px);z-index:6;background:none;border:0;padding:0;cursor:pointer;line-height:0}
.bearsvg{width:100%;height:auto;overflow:visible;display:block}
.bsway{transform-origin:90px 222px;animation:bsway 1.25s ease-in-out infinite alternate}
@keyframes bsway{from{transform:rotate(-3deg)}to{transform:rotate(.8deg)}}
.bear .hat{transform-origin:90px 44px;animation:hatwob .33s ease-in-out infinite alternate}
@keyframes hatwob{from{transform:rotate(-2deg)}to{transform:rotate(2.6deg) translate(1px,-1.5px)}}
.bear .arm{transform-origin:126px 128px;transform:rotate(184deg);transition:transform .8s cubic-bezier(.3,1.5,.5,1)}
.bear.gone .arm{transform:rotate(352deg)}
.bear.gone .hat{animation:hatfly 2.9s cubic-bezier(.45,0,.9,.55) forwards}
@keyframes hatfly{0%{transform:translate(0,0) rotate(0)}10%{transform:translate(3px,-26px) rotate(-16deg)}100%{transform:translate(-700px,-300px) rotate(-760deg)}}
.bear.back .hat{animation:hatin .6s ease-out,hatwob .33s ease-in-out infinite alternate}
@keyframes hatin{from{opacity:0;translate:0 -34px}to{opacity:1;translate:0 0}}
.bear .scarf{transform-origin:100px 140px;animation:scarf .22s ease-in-out infinite alternate}
@keyframes scarf{from{transform:skewY(-10deg) scaleX(1)}to{transform:skewY(6deg) scaleX(1.18)}}
.bear .wide,.bear .tuft{display:none}
.bear.gone .squint{display:none}.bear.gone .wide,.bear.gone .tuft{display:block}
@keyframes ping{from{opacity:1;transform:translate(-50%,-50%) scale(.45)}to{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
.nogl{position:absolute;inset:0;display:grid;place-items:center;z-index:25;text-align:center;padding:24px;background:#1a1420}
.nogl[hidden]{display:none}
.nogl h3{font:800 22px Archivo,sans-serif;margin:0 0 8px}
@media (max-width:760px){
  .title{max-width:calc(100% - 32px)}
  .title h1{font-size:30px}.title .look{font-size:11px}
  .goals{display:none}
  .card{left:12px;right:12px;width:auto;top:auto;bottom:12px}
  .rose{width:96px;bottom:auto;top:auto;left:12px;bottom:calc(12px + 0px)}
  .card.open~.rose,.card.open~.face{opacity:0}
  .face{display:none}
  .sketch{left:120px;bottom:16px}
  .tags span.st,.tags span.ft{display:none}
  .bear{display:none}
}
@media (prefers-reduced-motion:reduce){
  .bear *{animation:none!important;transition:none!important}
  .card,#toast,.ui{transition:none}
  .ui,.tags{animation:none!important}
}
</style>
</head>
<body>
<canvas class="sky" aria-hidden="true"></canvas>
<canvas class="gl" aria-hidden="true"></canvas>
<div class="tags" aria-hidden="true"></div>
<div class="ui" id="ui">
  <header class="title">
    <p class="eyebrow" id="eyebrow">Stop 06 · The Summit · 6,288 ft</p>
    <h1 id="hl"></h1>
    <p class="sub" id="sub"></p>
    <p class="look" id="look"></p>
  </header>
  <ul class="goals" id="goals" aria-label="Where I'm headed"></ul>
  <div class="pks" id="pks"></div>
  <aside class="card" id="card" aria-live="polite"><p class="k" id="cardK"></p><h2 id="cardT"></h2><p class="where" id="cardW"></p><p class="t" id="cardX"></p></aside>
  <div class="rose" id="rose"></div>
  <p class="face" id="face"></p>
  <button class="sketch" id="sketch" type="button" aria-pressed="true" title="Switch between the pencil sketch and full colour"><i aria-hidden="true">✎</i><span>Pencil</span></button>
  <div id="anemHost"></div>
</div>
<section class="sr" id="srlist" aria-label="Where I'm headed, full text"></section>
<div class="fog" id="fog" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="nogl" id="nogl" hidden><div><h3>The summit needs WebGL</h3>This stop draws the real terrain in 3D. Try a recent browser with hardware acceleration and an internet connection.</div></div>

<script src="../content.js"></script>
<script src="../bridge.js"></script>
<script src="../data/summit-geo.js"></script>
<script src="../data/summit-detail.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ====================================================================
   ⑥ THE SUMMIT. You stand at the summit sign; scrolling turns you around
   it (more than one full turn) and each "where I'm headed" peak's card
   opens as it comes into view. Drag turns freely. Real terrain (USGS) and
   real summit layout (OpenStreetMap: buildings, deck, lots, Cog, trails,
   730 surveyed cairns, masts). Secret: spin the observatory anemometer.
   ==================================================================== */
const Climb=window.Climb,CS=(window.CONTENT&&CONTENT.summit)||{};
/* the data files declare top-level consts (global bindings, not window properties) */
const SGEO=typeof SUMMIT_GEO!=='undefined'?SUMMIT_GEO:null,DET=typeof SUMMIT_DETAIL!=='undefined'?SUMMIT_DETAIL:null;
const $=s=>document.querySelector(s),TAU=Math.PI*2,D2R=Math.PI/180,R2D=180/Math.PI;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const wrap180=a=>((a%360)+540)%360-180,norm360=a=>((a%360)+360)%360,brgOf=(x,z)=>norm360(Math.atan2(x,-z)*R2D);
const CARD=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'],cardOf=b=>CARD[Math.round(norm360(b)/22.5)%16];
const mq=matchMedia('(prefers-reduced-motion: reduce)');let RM=mq.matches;if(mq.addEventListener)mq.addEventListener('change',e=>{RM=e.matches;dirty=true});
const H=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`,mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkNoise(seed){const r=rng(seed),p=new Uint8Array(512),a=[];for(let i=0;i<256;i++)a.push(i);for(let i=255;i>0;i--){const j=r()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}for(let i=0;i<512;i++)p[i]=a[i&255];
  const g=(i,j)=>p[p[i&255]+(j&255)]/255,sm=t=>t*t*(3-2*t);const n=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=sm(fx),v=sm(fy);return lerp(lerp(g(i,j),g(i+1,j),u),lerp(g(i,j+1),g(i+1,j+1),u),v)};
  const fbm=(x,y,o=4)=>{let s=0,a2=.5,f=1,t=0;for(let k=0;k<o;k++){s+=a2*n(x*f,y*f);t+=a2;a2*=.5;f*=2.03}return s/t};return {n,fbm}}
const cl=o=>Array.isArray(o)?o.map(cl):(o&&typeof o==='object'?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,cl(v)])):o);
function lerpAny(a,b,t){if(typeof a==='number')return a+(b-a)*t;if(Array.isArray(a))return a.map((x,i)=>lerpAny(x,b[i],t));if(a&&typeof a==='object'){const o={};for(const k in a)o[k]=lerpAny(a[k],b[k],t);return o}return b}

/* ---------------- words: all from CONTENT ---------------- */
const setText=(sel,txt)=>{const e=$(sel);if(!txt){e.hidden=true;return}e.hidden=false;e.textContent=txt};
setText('#hl',CS.headline);setText('#sub',CS.sub);setText('#look',CS.lookingFor);
const normName=s=>String(s||'').replace(/^Mt\.?\s+/i,'Mount ').trim();
const PEAKS=(CS.peaks||[]).map((p,i)=>{const g=SGEO&&SGEO.peaks.find(q=>q[0].toLowerCase()===normName(p.peak).toLowerCase());
  const b0=p.bearing||0,x=g?g[2]:Math.sin(b0*D2R)*8000,z=g?g[3]:-Math.cos(b0*D2R)*8000;return Object.assign({},p,{n:i+1,x,z,b:brgOf(x,z),d:Math.hypot(x,z),real:!!g})});
const where=p=>`${p.peak} · ${Math.round(p.b)}° ${cardOf(p.b)} · ${(p.d/1000).toFixed(1)} km`;
// screen-reader + no-interaction copy of every card
$('#srlist').innerHTML='';{const ul=document.createElement('ul');PEAKS.forEach(p=>{const li=document.createElement('li');li.textContent=`${p.title}: ${p.text} (${where(p)})`;ul.appendChild(li)});$('#srlist').appendChild(ul)}

/* ---------------- palettes + scheme tween (storm / sunset / aurora) ---------------- */
const P={
 storm:{nite:0,name:'Storm',skyTop:H('#070b17'),skyMid:H('#222f48'),skyBot:H('#617289'),glow:H('#a9c1e0'),ridge:[H('#74839d'),H('#566681'),H('#3d4b65'),H('#283349'),H('#161d2c')],cloudLit:H('#d6deea'),cloudDark:H('#6c7a91'),accent:H('#86d6ff'),ink:H('#eef4fb'),ground:H('#0e131d'),panel:H('#0a111d'),stars:0,aurora:0,storm:1,sun:0,win:H('#ffd98a'),winA:.9},
 sunset:{nite:0,name:'Sunset',skyTop:H('#2a1450'),skyMid:H('#c43c6c'),skyBot:H('#ffa24a'),glow:H('#ffd37a'),ridge:[H('#f08aa0'),H('#cc6190'),H('#96447e'),H('#5f2d68'),H('#2e1b46')],cloudLit:H('#ffd2aa'),cloudDark:H('#b4527e'),accent:H('#ffcf5c'),ink:H('#fff3e4'),ground:H('#221033'),panel:H('#2a1236'),stars:.3,aurora:0,storm:0,sun:1,win:H('#ffc27a'),winA:.55},
 aurora:{nite:1,name:'Aurora',skyTop:H('#01060f'),skyMid:H('#05293b'),skyBot:H('#0f6868'),glow:H('#5cffb0'),ridge:[H('#33808c'),H('#206272'),H('#14485b'),H('#0b3142'),H('#05161f')],cloudLit:H('#a8f2e0'),cloudDark:H('#1d6670'),accent:H('#6dffb8'),ink:H('#e9fff6'),ground:H('#030f19'),panel:H('#031420'),stars:1,aurora:1,storm:0,sun:0,win:H('#ffe2a0'),winA:1}
};
const SCHEMES=['storm','sunset','aurora'];
let curName='sunset',cur=cl(P[curName]),tweenFrom=null,tw=1,flash=0,found=false,dirty=true;
function applyVars(){const s=document.documentElement.style;s.setProperty('--accent',rgba(cur.accent));s.setProperty('--ink',rgba(cur.ink));s.setProperty('--panel',rgba(cur.panel,.7))}
function setScheme(n){if(n===curName)return;curName=n;tweenFrom=cl(cur);tw=RM?1:0;if(RM){cur=cl(P[n]);applyVars()}dirty=true}
function stepPal(dt){if(tw>=1)return;tw=Math.min(1,tw+dt/.9);const e=tw*tw*(3-2*tw);cur=lerpAny(tweenFrom,P[curName],e);if(tw>=1)cur=cl(P[curName]);applyVars();dirty=true}
applyVars();
let toastT=0;function toast(html,ms=2600){const el=$('#toast');el.innerHTML=html;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms)}
function cycleScheme(){const n=SCHEMES[(SCHEMES.indexOf(curName)+1)%3];setScheme(n);Climb.patch('anemometer');
  if(!found){found=true;toast('<b>Found it!</b> The anemometer. Trail patch earned.<br>Keep spinning: storm, sunset, aurora.',4600)}else toast('Sky: <b>'+P[n].name+'</b>',1400)}

/* ---------------- sky (2D canvas behind the WebGL scene, projected through the camera) ---------------- */
const SUN_AZ=285,WIND_TO=110,OBS={x:-14,z:-36};
const SKYSTARS=(()=>{const r=rng(91);return Array.from({length:260},()=>({az:r()*360,alt:2+Math.pow(r(),.85)*74,s:.5+r()*1.3,p:r()*TAU}))})();
const SKYCL=(()=>{const r=rng(17);return Array.from({length:18},()=>({az:r()*360,alt:3+r()*20,w:12+r()*26,h:.16+r()*.12,sp:.4+r()*.9,a:.4+r()*.4}))})();
function paintSky(ctx,W,Hh,t,dt,sp,hy,ppd){
  const c=cur,top=Math.max(30,hy);let g=ctx.createLinearGradient(0,0,0,top);g.addColorStop(0,rgba(c.skyTop));g.addColorStop(.6,rgba(c.skyMid));g.addColorStop(1,rgba(c.skyBot));
