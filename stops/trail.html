<!DOCTYPE html>
<html lang="en" data-stop="trail" data-span="5">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Trail · Ammonoosuc Ravine to Lakes of the Clouds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--tabbg:#13171a;--tabfg:#e8ece6;--tabline:#2b3338;--gold:#f2b94b;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0e10;color:var(--tabfg);font:14px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- tab bar ---------- */
#tabs{flex:none;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--tabbg);border-bottom:1px solid var(--tabline);position:relative;z-index:80}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:8px;white-space:nowrap}
.brand b{font:700 13px var(--ui);letter-spacing:.14em}
.brand small{font-size:10.5px;color:#8b979d;letter-spacing:.04em}
.tablist{display:flex;gap:4px}
.tablist button{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 8px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:#a9b4b9;font-weight:600;font-size:13px;white-space:nowrap}
.tablist button kbd{font:700 11px var(--ui);display:grid;place-items:center;width:20px;height:20px;border-radius:5px;background:#252d32;color:#c9d2d6}
.tablist button:hover{background:#1c2327;color:#fff}
.tablist button[aria-selected=true]{background:#232c31;border-color:#3b474e;color:#fff}
.tablist button[aria-selected=true] kbd{background:var(--gold);color:#241a05}
.tablist button:focus-visible,.hintbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.spacer{flex:1}
#secpill{font-size:12px;color:#8b979d;white-space:nowrap}
#secpill.got{color:#9be3a8}
.hintbtn{height:30px;padding:0 14px;border-radius:99px;border:1px solid #46535a;background:#1d252a;font-weight:700;font-size:13px;cursor:pointer}
.hintbtn:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:1100px){.tablist button span{font-size:12px}}
@media(max-width:900px){.brand small,#secpill{display:none}.tablist button{padding:0 9px 0 6px;font-size:12px}}
@media(max-width:700px){.brand{display:none}}

/* ---------- stage / variants ---------- */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.variant{position:absolute;inset:0;display:none;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.variant.on{display:block}
.variant canvas.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.world{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.world>*{pointer-events:auto}
.dark{position:absolute;inset:0;z-index:20;pointer-events:none;display:none}
.cap{position:absolute;left:16px;top:14px;z-index:40;pointer-events:none;max-width:min(520px,60%)}
.cap h2{margin:0;font:700 12px var(--uifont);letter-spacing:.16em;text-transform:uppercase;color:var(--capfg);opacity:.95}
.cap p{margin:4px 0 0;font:500 12.5px/1.35 var(--uifont);color:var(--capfg);opacity:.8}
.ring{position:absolute;z-index:45;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:3px solid #ff6a45;pointer-events:none;display:none;animation:ring .8s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.7);opacity:0}}

/* ---------- dock (shared) ---------- */
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:99px;background:var(--dockbg);color:var(--dockfg);border:1px solid var(--dockline);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:700 12px var(--uifont);max-width:calc(100% - 20px)}
.dock .nav{width:28px;height:28px;border-radius:50%;border:1px solid var(--dockline);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:12px;padding:0}
.dock .nav:hover{background:rgba(255,255,255,.14)}
.dock .dots{display:flex;gap:7px;align-items:center}
.dock .dot{width:12px;height:12px;padding:0;border:0;border-radius:3px;transform:rotate(45deg) scale(.82);cursor:pointer;opacity:.55;transition:transform .2s,opacity .2s}
.dock .dot:hover{opacity:1}
.dock .dot.on{opacity:1;transform:rotate(45deg) scale(1.18);box-shadow:0 0 0 2px var(--dockfg)}
.dock .mi{min-width:92px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}
.dock button:focus-visible,.dot:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- trail signs (DOM) ---------- */
.sg{position:absolute;left:0;top:0;width:340px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;will-change:transform,opacity;text-align:left;opacity:0;pointer-events:none}
.sg.show{pointer-events:auto}
.sg:focus-visible{outline:3px solid #ffd54a;outline-offset:8px;border-radius:6px}
.sg .board{position:relative;display:flex;flex-direction:column;justify-content:center;gap:5px;width:340px;height:112px;padding:10px 46px 10px 54px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),linear-gradient(180deg,#8f6137,#6e4726 56%,#5b3a1d);
  clip-path:polygon(0 0,93% 0,100% 50%,93% 100%,0 100%);transition:filter .2s}
.sg.pl .board{clip-path:polygon(7% 0,100% 0,100% 100%,7% 100%,0 50%);padding:10px 54px 10px 46px}
.sg .board::before{content:"";position:absolute;inset:6px;border:2px solid rgba(255,232,170,.28);border-radius:3px;clip-path:inherit}
.sg:hover .board{filter:brightness(1.14) saturate(1.1)}
.sg .blaze{position:absolute;left:19px;top:50%;width:14px;height:46px;margin-top:-23px;border-radius:2px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.28)}
.sg.pl .blaze{left:auto;right:19px}
.sg .nm{font:400 30px/1 'Alfa Slab One',Georgia,serif;color:#f5e5b8;letter-spacing:.02em;text-shadow:0 2px 0 rgba(36,18,6,.7);white-space:nowrap}
.sg .row{display:flex;align-items:baseline;gap:9px;font:700 14px/1.2 'Roboto Slab',Georgia,serif;color:#e8d3a0;text-shadow:0 1px 0 rgba(36,18,6,.6)}
.sg .mi{font-style:normal;background:rgba(255,236,180,.92);color:#4a2e14;padding:1px 7px;border-radius:3px;text-shadow:none;white-space:nowrap}
.sg .stick{display:block;width:24px;height:100px;background:linear-gradient(90deg,#4a2f18,#6b4524 45%,#3e2713);border-radius:2px 2px 0 0;margin-top:-1px;box-shadow:inset 0 6px 8px rgba(0,0,0,.35)}
.sg .stones{display:none}
.sg .board.warn{background:repeating-linear-gradient(135deg,#17120a 0 13px,#f4b800 13px 26px);padding-top:0;padding-bottom:0}
.sg .board.warn::before{inset:9px;border:0;background:#f4b800;border-radius:2px}
.sg .board.warn>*{position:relative}
.sg .board.warn .nm{color:#17120a;text-shadow:none;font-size:23px}
.sg .board.warn .row{color:#3a2a06;text-shadow:none}
.sg .board.warn .mi{background:#17120a;color:#f4b800}
.sg .board.warn .blaze{display:none}
.sg.cairn .stick{width:10px;height:26px;background:linear-gradient(90deg,#6b4a2a,#8d6538)}
.sg.cairn .stones{display:block;width:200px;height:158px;margin-top:-2px;overflow:visible}
.sg.cairn .board{width:320px;height:100px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 10px),linear-gradient(180deg,#a97c4d,#8a6139 60%,#74502e);clip-path:polygon(2% 0,98% 0,100% 12%,100% 88%,98% 100%,2% 100%,0 88%,0 12%);padding:10px 24px 10px 50px}
.sg.cairn{width:340px}
.sg.kiosk .board{background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 12px),linear-gradient(180deg,#c9a46a,#a9824b 60%,#8f6a3b);clip-path:polygon(0 14%,50% 0,100% 14%,100% 100%,0 100%);padding:22px 30px 10px 54px}
.sg.kiosk .nm{color:#2c3a22;text-shadow:0 1px 0 rgba(255,240,200,.35)}
.sg.kiosk .row{color:#43331c;text-shadow:none}
.sg.kiosk .mi{background:#2f4a31;color:#eaf2d6}
.sg.kiosk .stick{background:linear-gradient(90deg,#8a6b42,#b08a56 45%,#76593a)}
.sg.mossy .board{background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 11px),linear-gradient(180deg,#6d4a2a,#523520 56%,#432b19)}
.sg.mossy .board::after{content:"";position:absolute;left:0;right:0;top:0;height:18px;background:radial-gradient(ellipse at 20% 0,rgba(110,160,70,.7),transparent 60%),radial-gradient(ellipse at 70% 0,rgba(90,140,60,.6),transparent 55%);pointer-events:none}

/* creatures (bear + owl) */
.crit{position:absolute;left:0;top:0;z-index:26;display:none;pointer-events:none}
.crit.bear{overflow:hidden}
.crit .cin{position:absolute;inset:0;--b:1}
.crit .cbody,.crit .ceyes,.crit .cbtn{position:absolute;inset:0;width:100%;height:100%;display:block}
.crit .cbody{filter:brightness(var(--b))}
.crit .cbtn{background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;border-radius:30%;z-index:2}
.crit .cbtn:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
.crit .ei{fill:#cfa83a}
.crit.bear .ei{fill:#1b110b}
.crit .ep{fill:#1a1408}
.crit .ei,.crit .ep{transform-box:fill-box;transform-origin:center;animation:blinkY 6.5s infinite}
.crit.bear .ei,.crit.bear .ep{animation-duration:4.7s}
@keyframes blinkY{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.crit.glow .ei{fill:#ffe98a;filter:drop-shadow(0 0 6px #ffd94a) drop-shadow(0 0 14px #ffb800)}
.crit.glow .ep{fill:#3a2a00}
.crit.bear.glow .ei{fill:#e4ff7a;filter:drop-shadow(0 0 5px #c8ff3a) drop-shadow(0 0 12px #8aff00)}
.crit.bear.glow .ep{fill:#1a2a00}

/* ---------- panel ---------- */
#panel{position:fixed;left:0;right:0;bottom:0;top:46px;z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
#panel.open{display:flex}
.p-scrim{position:absolute;inset:0;background:rgba(4,7,9,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}}
.p-card{position:relative;display:grid;grid-template-columns:230px 1fr;gap:30px;width:min(880px,100%);max-height:100%;overflow:auto;padding:30px;background:var(--pbg);color:var(--pfg);border-radius:var(--pr,10px);box-shadow:var(--psh);font-family:var(--pfont);animation:rise .38s cubic-bezier(.2,.8,.2,1)}
.p-x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--pline);background:var(--pchip);color:var(--pfg);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;z-index:3}
.p-x:hover{background:var(--pacc);color:var(--pacct)}
.p-x:focus-visible,.p-card button:focus-visible{outline:3px solid var(--pacc);outline-offset:2px}
.p-dev{display:flex;align-items:center;justify-content:center}
.dev{position:relative;background:#101316;box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 0 0 2px #2a3036}
.dev.phone{width:196px;height:396px;border-radius:34px;padding:9px}
.dev.phone .notch{position:absolute;left:50%;top:14px;width:64px;height:18px;margin-left:-32px;border-radius:12px;background:#000;z-index:2}
.dev .screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;background:linear-gradient(160deg,var(--sc1),var(--sc2));color:var(--sct);overflow:hidden}
.dev.phone .screen{border-radius:26px}
.dev.browser{width:100%;max-width:240px;height:190px;border-radius:10px;padding:0}
.dev.browser .bar{height:22px;display:flex;align-items:center;gap:5px;padding:0 9px;background:#1b2024;border-radius:10px 10px 0 0}
.dev.browser .bar i{width:7px;height:7px;border-radius:50%;background:#59646b}
.dev.browser .screen{height:calc(100% - 22px);border-radius:0 0 10px 10px}
.dev .ic{font-size:30px;opacity:.85}
.dev .cap2{font:600 11.5px/1.35 var(--pfont);opacity:.85;max-width:150px}
.dev .screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px);pointer-events:none}
.p-body{min-width:0;display:flex;flex-direction:column;gap:14px;padding-right:22px}
.p-kick{display:flex;align-items:center;gap:8px;font:700 12px var(--pfont);letter-spacing:.14em;text-transform:uppercase;color:var(--pmut)}
.p-kick i{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);display:inline-block}
.p-body h3{margin:0;font:var(--ptitle);color:var(--pfg);letter-spacing:var(--pls,0)}
.p-award{display:inline-flex;align-items:center;gap:11px;align-self:flex-start;padding:8px 15px 8px 9px;border-radius:99px;background:var(--pchip);border:1px solid var(--pline);font-weight:700;font-size:14px}
.p-award .ros{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--pacc);color:var(--pacct);font-size:15px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.p-award small{display:block;font-weight:500;font-size:12px;color:var(--pmut);margin-top:1px}
.p-award.plain{padding-left:15px}
.p-award.wip{background:#f4b800;color:#17120a;border-color:#17120a}
.p-line{margin:0;font-size:16px;line-height:1.55}
.p-line.ph,.p-meta{color:var(--pmut)}
.p-line.ph{font-style:italic}
.p-meta{margin:-6px 0 0;font-size:13px}
.p-sec{font:700 11px var(--pfont);letter-spacing:.16em;text-transform:uppercase;color:var(--pmut);margin:2px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:4px 11px;border-radius:99px;background:var(--pchip);border:1px solid var(--pline);font-size:13px;font-weight:600}
.chip.tbd{border-style:dashed;color:var(--pmut);font-weight:500}
.p-links{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px}
.lk{padding:5px 11px;border-radius:7px;border:1px dashed var(--pline);color:var(--pmut)}
.p-foot{margin-top:auto;font-size:11.5px;color:var(--pmut)}
@media(max-width:760px){.p-card{grid-template-columns:1fr;gap:18px;padding:22px}.p-dev{order:-1}.dev.phone{width:150px;height:300px;border-radius:26px}.dev.phone .screen{border-radius:19px}.p-body{padding-right:0}}
/* panel themes */
.p-card[data-th=A]{--pbg:#f7eed4;--pfg:#35260f;--pmut:#7c6a46;--pline:#b79f66;--pchip:#efe0b3;--pacc:#c45b22;--pacct:#fff4dc;--pr:6px;--pfont:'Roboto Slab',Georgia,serif;--ptitle:400 44px/1.05 'Alfa Slab One',Georgia,serif;--psh:0 0 0 4px #f7eed4,0 0 0 6px #7b5a2c,0 30px 60px rgba(40,20,5,.45);--sc1:#5a7f6a;--sc2:#e7b783;--sct:#fff7e3}
.p-card[data-th=B]{--pbg:linear-gradient(160deg,#1c0f3a,#2a1250 60%,#3b1559);--pfg:#ffe9d0;--pmut:#c9a9d9;--pline:#7b4bb0;--pchip:rgba(255,255,255,.07);--pacc:#ff5fa2;--pacct:#1b0a2e;--pr:0;--pfont:'Rajdhani','Arial Narrow',sans-serif;--ptitle:700 46px/1 'Rajdhani','Arial Narrow',sans-serif;--pls:.04em;--psh:0 0 0 1px #ff5fa2,0 0 40px rgba(255,95,162,.35),0 30px 60px rgba(0,0,0,.5);--sc1:#ff7a59;--sc2:#4b1d7c;--sct:#fff}
.p-card[data-th=B]{clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
.p-card[data-th=C]{--pbg:linear-gradient(180deg,#e9d6a8,#d9c08a);--pfg:#2d1e0e;--pmut:#6e5530;--pline:#8a6a3a;--pchip:rgba(255,248,224,.55);--pacc:#2f5a3a;--pacct:#f3ecd2;--pr:4px;--pfont:'Oswald','Arial Narrow',sans-serif;--ptitle:700 44px/1.02 'Oswald','Arial Narrow',sans-serif;--pls:.03em;--psh:inset 0 0 0 5px #6b4524,inset 0 0 0 7px rgba(255,235,180,.5),0 30px 60px rgba(0,0,0,.5);--sc1:#4a7a52;--sc2:#c9d79a;--sct:#fff}
.p-card[data-th=D]{--pbg:linear-gradient(160deg,#0d1220,#151b2d);--pfg:#e8ecf5;--pmut:#8b97b3;--pline:#2d3753;--pchip:rgba(255,255,255,.06);--pacc:#ffd98a;--pacct:#1d1604;--pr:14px;--pfont:'Space Mono',ui-monospace,monospace;--ptitle:700 36px/1.1 'Barlow Condensed','Space Mono',sans-serif;--pls:.02em;--psh:0 0 0 1px #2d3753,0 0 70px rgba(255,217,138,.12),0 30px 60px rgba(0,0,0,.6);--sc1:#10162a;--sc2:#2a3b5e;--sct:#ffe3a3}
.p-card[data-th=D] .p-line,.p-card[data-th=D] .chip{font-size:13.5px}

/* toast */
#toast{position:fixed;left:50%;bottom:74px;z-index:120;transform:translate(-50%,16px);opacity:0;padding:11px 20px;border-radius:99px;background:rgba(14,18,16,.92);color:#fff;border:1px solid rgba(255,255,255,.2);font:600 14px var(--ui);box-shadow:0 12px 30px rgba(0,0,0,.4);pointer-events:none;transition:opacity .35s,transform .35s;max-width:calc(100% - 28px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.big{background:linear-gradient(90deg,#2b2412,#141a10);border-color:#e8c25c;color:#ffe9a8}

/* ====================================================================
   A: layered parallax forest (painted, flat, misty, dawn)
   ==================================================================== */
#vA{--uifont:'Roboto Slab',Georgia,serif;--dockbg:rgba(250,240,212,.9);--dockfg:#3b2814;--dockline:rgba(90,60,25,.4);--capfg:#fff6dc;background:#9ec3b4}
#vA .cap h2{text-shadow:0 1px 8px rgba(30,50,40,.55)}#vA .cap p{text-shadow:0 1px 8px rgba(30,50,40,.65)}
#vA .paper{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.2;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .9 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
#vA .vig{position:absolute;inset:0;z-index:9;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(40,55,45,.38))}

/* ====================================================================
   B: pseudo-3D low-poly road (dusk synth)
   ==================================================================== */
#vB{--uifont:'Rajdhani','Arial Narrow',sans-serif;--dockbg:rgba(24,8,48,.78);--dockfg:#ffd9b0;--dockline:rgba(255,95,162,.55);--capfg:#ffd9b0;background:#2a1050}
#vB .cap h2{color:#ff7ab6;text-shadow:0 0 12px rgba(255,95,162,.6)}
#vB .dock{border-radius:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:7px 24px}
#vB .dock .nav{border-radius:3px}
#vB .scan{position:absolute;inset:0;z-index:9;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.hit{position:absolute;left:0;top:0;z-index:6;padding:0;border:0;background:transparent;cursor:pointer;opacity:0;pointer-events:none;border-radius:6px}
.hit.show{pointer-events:auto;opacity:1}
.hit:focus-visible{outline:3px solid #ffd54a;outline-offset:3px}
#bHud{position:absolute;right:16px;top:12px;z-index:40;text-align:right;font:700 13px 'Rajdhani',sans-serif;letter-spacing:.14em;color:#ffd9b0;text-shadow:0 0 10px rgba(255,95,162,.7);pointer-events:none}
#bHud big{display:block;font:700 40px/1 'Rajdhani',sans-serif;letter-spacing:.04em;color:#fff}
#bHud .bar{margin-top:6px;width:200px;height:6px;background:rgba(255,255,255,.18);margin-left:auto}
#bHud .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5fa2,#ffb347)}

/* ====================================================================
   C: the fork
   ==================================================================== */
#vC{--uifont:'Oswald','Arial Narrow',sans-serif;--dockbg:rgba(38,25,14,.84);--dockfg:#f3e3b6;--dockline:rgba(255,230,170,.35);--capfg:#fff1cf;background:#1c2a1c}
#vC .cap h2{text-shadow:0 1px 10px rgba(0,0,0,.7)}#vC .cap p{text-shadow:0 1px 10px rgba(0,0,0,.8)}
.cj,.cb{position:absolute;inset:0;transition:transform .95s cubic-bezier(.65,0,.35,1),opacity .8s ease,filter .9s ease}
.cj{z-index:2}
.cb{z-index:1;opacity:0;pointer-events:none;transform:scale(1.18);filter:blur(5px)}
#vC.inbranch .cj{opacity:0;pointer-events:none;transform:scale(2.4);filter:blur(7px)}
#vC.inbranch .cb{opacity:1;pointer-events:auto;transform:none;filter:none;transition-delay:.25s}
#vC.back .cj{transition-delay:.2s}
#vC.back .cb{transition-delay:0s}
.cb .world{z-index:5}
.cj-sign{position:absolute;left:50%;bottom:25%;width:0;height:0;z-index:6;font-size:clamp(8.5px,min(1.1vw,2vh),18px)}
.jpost{position:absolute;left:-1.5em;bottom:0;width:3em;height:25em;background:linear-gradient(90deg,#3a2413,#6a4524 40%,#4a2f19 70%,#2f1c0f);border-radius:.3em .3em 0 0;box-shadow:0 .5em 1.2em rgba(0,0,0,.45)}
.jcap{position:absolute;left:-2.2em;bottom:25em;width:4.4em;height:1.5em;background:#2f1c0f;border-radius:.5em .5em 0 0;box-shadow:inset 0 .3em .3em rgba(255,255,255,.12)}
.jplate{position:absolute;left:-9em;bottom:28.2em;width:18em;text-align:center;font:600 1em/1 'Oswald',sans-serif;letter-spacing:.3em;color:#e9d7a6;text-shadow:0 .1em 0 rgba(0,0,0,.7)}
.jplate::before,.jplate::after{content:"";display:inline-block;width:3em;height:.14em;background:#e9d7a6;vertical-align:middle;margin:0 .8em;opacity:.7}
.jb{position:absolute;display:block;padding:0;border:0;background:none;cursor:pointer;color:#f3e3b6;text-align:left;transition:transform .25s ease,filter .25s;font-family:'Oswald',sans-serif}
.jb .bd{position:relative;display:flex;flex-direction:column;justify-content:center;width:23em;height:6.6em;padding:.6em 3.4em .6em 1.6em;
 background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 .12em,transparent .12em .9em),linear-gradient(180deg,#7a4f2a,#5f3c1f 55%,#4d311a);box-shadow:inset 0 .25em .3em rgba(255,255,255,.12),inset 0 -.3em .4em rgba(0,0,0,.35);filter:drop-shadow(0 .5em .5em rgba(0,0,0,.45))}
.jb .bd::before{content:"";position:absolute;inset:.45em;border:.14em solid rgba(240,214,150,.35);clip-path:inherit}
.jb .t{font:700 2.55em/1 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#f6e7b8;text-shadow:0 .06em 0 rgba(30,14,4,.8),0 -.03em 0 rgba(255,235,170,.25)}
.jb .s{font:500 1.05em/1.25 'Oswald',sans-serif;letter-spacing:.07em;color:#d9c18a;margin-top:.35em;text-transform:uppercase}
.jb .m{position:absolute;right:3.6em;top:.65em;font:700 .95em 'Oswald',sans-serif;letter-spacing:.06em;color:#2a1a0b;background:#ecd9a4;padding:.1em .55em;border-radius:.25em}
.jb .ar{position:absolute;top:50%;margin-top:-1.2em;font-size:2.4em;line-height:1;color:#f6e7b8;opacity:.9}
.jb:hover,.jb:focus-visible,.jb.hov{filter:brightness(1.18)}
.jb:focus-visible{outline:.25em solid #ffd54a;outline-offset:.5em}
.jb.l{left:-23.8em;bottom:11.2em;transform:rotate(-2.2deg)}
.jb.l .bd{clip-path:polygon(7% 0,100% 0,100% 100%,7% 100%,0 50%);padding:.6em 1.6em .6em 3.4em}
.jb.l .ar{left:.5em}.jb.l .m{right:1.4em}
.jb.l:hover,.jb.l.hov{transform:rotate(-3.4deg) translateX(-.6em)}
.jb.r{left:-1.8em;bottom:3.6em;transform:rotate(1.6deg)}
.jb.r .bd{clip-path:polygon(0 0,93% 0,100% 50%,93% 100%,0 100%)}
.jb.r .ar{right:.5em}
.jb.r:hover,.jb.r.hov{transform:rotate(2.6deg) translateX(.6em)}
.jb.u{left:-11.5em;bottom:18.8em;transform:rotate(-.6deg)}
.jb.u .bd{clip-path:polygon(0 22%,50% 0,100% 22%,100% 100%,0 100%);padding:1.8em 1.6em .6em 1.6em;height:7.4em;align-items:center;text-align:center}
.jb.u .t{font-size:1.8em;white-space:nowrap}
.jb.u .ar{top:.1em;left:50%;margin:0 0 0 -.5em;font-size:1.9em}
.jb.u .m{right:2em;top:2.2em}
.jb.u:hover,.jb.u.hov{transform:rotate(-.6deg) translateY(-.5em)}
.jb.u .t,.jb.u .s{width:100%}
.jb .wip{display:inline-block;margin-left:.5em;color:#f4b800}
.cards{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;gap:14px;align-items:flex-end;width:min(760px,calc(100% - 30px));justify-content:center}
.cards .card{flex:1;min-width:0;max-width:240px;padding:6px 6px 8px;background:#f2e8cf;border:0;border-radius:3px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.5);transition:transform .25s;color:#2d1e0e;text-align:center;font:600 12.5px 'Oswald',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.cards .card:nth-child(1){transform:rotate(-2.5deg)}.cards .card:nth-child(2){transform:rotate(1deg) translateY(-6px)}.cards .card:nth-child(3){transform:rotate(2.5deg)}
.cards .card:hover,.cards .card:focus-visible,.cards .card.hov{transform:translateY(-8px) rotate(0)}
.cards canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#444}
.cards .card span{display:block;margin-top:5px}.cards .card small{display:block;font-weight:500;font-size:10.5px;color:#6e5530;letter-spacing:.04em;text-transform:none}
.cards-label{position:absolute;left:50%;bottom:calc(62px + 160px);transform:translateX(-50%);z-index:7;color:rgba(255,241,207,.0)}
.cback{position:absolute;left:14px;top:62px;z-index:41;display:none;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;border:1px solid rgba(255,230,170,.45);background:rgba(38,25,14,.78);color:#f3e3b6;font:600 13px 'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
#vC.inbranch .cback{display:flex}
.cback:hover{background:rgba(60,40,20,.9)}
.cback:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
.bpills{position:absolute;right:14px;top:calc(14px + var(--nav-h,0px));z-index:41;display:none;gap:6px}
#vC.inbranch .bpills{display:flex}
.bpills button{padding:7px 13px;border-radius:99px;border:1px solid rgba(255,230,170,.4);background:rgba(38,25,14,.78);color:#f3e3b6;font:600 12px 'Oswald',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.bpills button[aria-pressed=true]{background:#f3e3b6;color:#2d1e0e}
.bpills button:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
#vC .dock{display:none}
#vC.inbranch .dock{display:flex}
#vC .cap{top:14px}
@media(max-width:900px){.bpills{top:auto;bottom:66px;right:auto;left:50%;transform:translateX(-50%)}.cards{bottom:60px}.cards .card small{display:none}}

/* ====================================================================
   D: night hike (side view, headlamp)
   ==================================================================== */
#vD{--uifont:'Space Mono',ui-monospace,monospace;--dockbg:rgba(7,10,20,.78);--dockfg:#cdd8ee;--dockline:rgba(150,170,220,.3);--capfg:#9fb0d4;background:#04060e;cursor:crosshair}
#vD .cap h2{color:#ffd98a}
#vD .sg{width:300px;transform-origin:50% 100%;-webkit-mask-image:none;mask-image:none}
#vD .sg .board{width:300px;height:104px;padding:10px 42px 10px 50px;background:linear-gradient(180deg,#2c2218,#1f1710 60%,#181109);
  -webkit-mask-image:radial-gradient(circle at var(--lx,-999px) var(--ly,-999px),#000 calc(var(--lr,200px)*.42),transparent var(--lr,200px));mask-image:radial-gradient(circle at var(--lx,-999px) var(--ly,-999px),#000 calc(var(--lr,200px)*.42),transparent var(--lr,200px))}
#vD .sg .board::before{border-color:rgba(255,232,170,.2)}
#vD .sg .stick{width:20px;height:90px;background:linear-gradient(90deg,#1b130c,#2c2016 50%,#150e08);box-shadow:none;-webkit-mask-image:radial-gradient(circle at var(--lx,-999px) var(--sy,-999px),#000 calc(var(--lr,200px)*.42),transparent var(--lr,200px));mask-image:radial-gradient(circle at var(--lx,-999px) var(--sy,-999px),#000 calc(var(--lr,200px)*.42),transparent var(--lr,200px))}
#vD .sg .nm{font:700 28px/1 'Barlow Condensed','Oswald',sans-serif;letter-spacing:.07em;color:#fff4c9;text-shadow:0 0 6px rgba(255,244,190,.9),0 0 22px rgba(255,230,150,.6)}
#vD .sg .row{font:400 12px/1.25 'Space Mono',monospace;color:#f2e2a8;text-shadow:0 0 8px rgba(255,230,150,.55)}
#vD .sg .mi{background:#fff4c9;color:#1d150a;text-shadow:none;box-shadow:0 0 14px rgba(255,235,160,.7)}
#vD .sg .blaze{box-shadow:0 0 12px currentColor,inset 0 0 0 2px rgba(0,0,0,.35)}
#vD .sg .board.warn{background:repeating-linear-gradient(135deg,#0d0b06 0 12px,#d9a400 12px 24px)}
#vD .sg .board.warn::before{background:#d9a400}
#vD .sg .board.warn .nm{color:#120d02;text-shadow:none;font-size:21px}
#vD .sg .board.warn .row{color:#3a2a06;text-shadow:none}
#vD .sg:focus-visible .board,#vD .sg:focus-visible .stick{-webkit-mask-image:none;mask-image:none}
#vD .hudn{position:absolute;right:16px;top:14px;z-index:40;font:400 11.5px 'Space Mono',monospace;color:#8294bd;text-align:right;pointer-events:none;letter-spacing:.04em}
#vD .hudn b{display:block;color:#ffd98a;font-weight:700;letter-spacing:.14em}
/* ====================================================================
   E + F: Ammonoosuc Ravine Trail realism kit
   Signs imitate WMNF / AMC routed boards: stained brown pine, routed
   capitals painted yellow, trail name on top, destinations + mileage,
   lag-bolted to a 4x4 post (set in a cairn above treeline).
   ==================================================================== */
.tablist{overflow-x:auto;scrollbar-width:none}.tablist::-webkit-scrollbar{display:none}
#vE{--uifont:'Overpass',system-ui,sans-serif;--dockbg:rgba(38,26,15,.86);--dockfg:#ecd28a;--dockline:rgba(236,210,138,.38);--capfg:#f6f0de;background:#2a3424}
#vF{--uifont:'Overpass',system-ui,sans-serif;--dockbg:rgba(26,32,38,.8);--dockfg:#eef2f4;--dockline:rgba(230,240,245,.38);--capfg:#fff;background:#a9bccb}
#vG{--uifont:'Overpass',system-ui,sans-serif;--dockbg:rgba(38,26,15,.86);--dockfg:#ecd28a;--dockline:rgba(236,210,138,.38);--capfg:#f6f0de;background:#2a3424}
#vG .cap h2,#vG .cap p{text-shadow:0 1px 8px rgba(0,0,0,.85)}
#vE .cap h2,#vF .cap h2{text-shadow:0 1px 8px rgba(0,0,0,.8)}#vE .cap p,#vF .cap p{text-shadow:0 1px 8px rgba(0,0,0,.9)}
#vF .cap h2,#vF .cap p{color:#fff}
.wmhud{position:absolute;right:16px;top:calc(14px + var(--nav-h,0px));z-index:40;text-align:right;pointer-events:none;font:700 11px/1.35 'Overpass',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#f6f0de;text-shadow:0 1px 6px rgba(0,0,0,.85)}
.wmhud b{display:block;font-size:15px;letter-spacing:.1em;color:#ecd28a}
.wmhud span{display:block;font-weight:600;letter-spacing:.03em;text-transform:none;font-size:12px;opacity:.9}
.wmcard{position:absolute;right:16px;top:calc(80px + var(--nav-h,0px));z-index:40;max-width:310px;padding:12px 15px;border-radius:6px;background:rgba(36,26,14,.84);color:#f3e9cb;border:1px solid rgba(236,210,138,.42);font:500 12.5px/1.45 'Overpass',sans-serif;opacity:0;transform:translateY(-6px);transition:opacity .45s,transform .45s;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.wmcard.on{opacity:1;transform:none}
.scard{position:absolute;left:50%;bottom:66px;z-index:41;width:min(460px,calc(100% - 24px));transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  display:block;text-align:left;padding:12px 16px 12px;border-radius:8px;cursor:pointer;color:#f3e9cb;background:rgba(36,26,14,.88);border:1px solid rgba(236,210,138,.5);box-shadow:0 12px 30px rgba(0,0,0,.4);font:500 13px/1.45 'Overpass',sans-serif;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scard.on{opacity:var(--ui,1);transform:translate(-50%,0);pointer-events:auto}
.scard small{display:block;font:800 10.5px 'Overpass',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ecd28a;opacity:.9}
.scard b{display:block;margin:2px 0 3px;font:800 19px/1.15 'Overpass',sans-serif;color:#fff6dc}
.scard span{display:block}
.scard em{display:inline-block;margin-top:7px;font:800 11px 'Overpass',sans-serif;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:#ecd28a;border-bottom:1px solid currentColor}
.scard:hover,.scard:focus-visible{border-color:#ecd28a;outline:none;background:rgba(46,33,17,.94)}
@media(max-width:760px){.scard{bottom:62px;padding:10px 13px}.scard b{font-size:17px}}
@media(prefers-reduced-motion:reduce){.scard{transition:none}}
.wmcard b{display:block;font:800 12px 'Overpass',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#ecd28a;margin-bottom:3px}
#vF .wmcard{background:rgba(24,30,36,.8);border-color:rgba(230,240,245,.35)}
.wmload{position:absolute;inset:0;z-index:30;display:grid;place-items:center;font:700 13px 'Overpass',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#24303a;pointer-events:none}
.wmload.err{color:#3a1d10;text-transform:none;letter-spacing:0;font-weight:600;font-size:14px;padding:30px;text-align:center}
@media(max-width:760px){.wmcard{display:none}.wmhud span{display:none}}
/* trail sign (project) */
.wm,.wmb,.wmstop,.wmj{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%;will-change:transform,opacity;opacity:0;pointer-events:none}
.wm{width:360px;padding:0;border:0;background:none;cursor:pointer;text-align:left;font-family:'Overpass',sans-serif}
.wm.show{pointer-events:auto}
.wm:focus-visible{outline:3px solid #ffd54a;outline-offset:8px;border-radius:6px}
.wm .wb,.wmb .wb,.wjb{position:relative;background:
  radial-gradient(ellipse 34px 9px at 17% 64%,rgba(28,14,5,.34),transparent 70%),
  radial-gradient(ellipse 22px 7px at 82% 28%,rgba(28,14,5,.28),transparent 70%),
  repeating-linear-gradient(178.8deg,rgba(255,226,170,.04) 0 2px,rgba(0,0,0,.07) 2px 3px,transparent 3px 10px),
  linear-gradient(180deg,#6b4729,#583820 46%,#4a2f1a);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 2px 1px rgba(255,220,170,.15),inset 0 -3px 5px rgba(0,0,0,.38),0 8px 14px rgba(0,0,0,.45);border-radius:5px}
.wm .wb{display:flex;flex-direction:column;gap:7px;width:360px;padding:16px 22px 15px;transition:filter .2s}
.wm:hover .wb{filter:brightness(1.13)}
.wb::before,.wmj .jbs::before{content:"";position:absolute;left:50%;top:-18px;width:30px;height:22px;margin-left:-15px;z-index:-1;border-radius:2px 2px 0 0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 5px),linear-gradient(90deg,#4b3f31,#7a6752 45%,#463a2c)}
.wbo{position:absolute;left:50%;top:6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c2bba9,#5a554b 72%);box-shadow:0 1px 1px rgba(0,0,0,.65)}
.wbo.b{top:auto;bottom:6px}
.wt,.wh,.jt{font:800 30px/1 'Overpass',sans-serif;letter-spacing:.035em;color:#ebd086;white-space:nowrap;text-transform:uppercase;text-shadow:0 -1px 0 rgba(0,0,0,.72),0 1px 0 rgba(255,232,170,.2)}
.wr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:700 14px/1.15 'Overpass',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#dcc27c;text-shadow:0 -1px 0 rgba(0,0,0,.7),0 1px 0 rgba(255,232,170,.16)}
.ws{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wn{font:800 22px/1 'Overpass',sans-serif;color:#ebd086}
.wp{position:relative;display:block;width:30px;height:250px;margin-top:-1px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 5px),linear-gradient(90deg,#4b3f31,#7a6752 45%,#463a2c);-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
.wbl{position:absolute;top:24px;left:50%;width:11px;height:28px;margin-left:-5.5px;border-radius:1.5px;opacity:.93;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.wm.warn .wb{background:radial-gradient(ellipse 40px 10px at 22% 70%,rgba(80,50,0,.25),transparent 70%),repeating-linear-gradient(178.8deg,rgba(255,250,220,.08) 0 2px,rgba(0,0,0,.05) 2px 3px,transparent 3px 10px),linear-gradient(180deg,#ecbf2e,#dcaa1e 60%,#c99a17)}
.wm.warn .wt,.wm.warn .wn{color:#2a1c0b;text-shadow:0 1px 0 rgba(255,244,190,.5),0 -1px 0 rgba(0,0,0,.28)}
.wm.warn .wr{color:#3c2b10;text-shadow:0 1px 0 rgba(255,244,190,.4)}
.oncairn .wp{height:96px;-webkit-mask-image:none;mask-image:none}
.wc{display:block;width:240px;height:112px;margin-top:-40px;overflow:visible}
/* decorative boards (trailhead, hut junction) */
.wmb{width:380px;gap:10px}
.wmb .wb{display:flex;flex-direction:column;gap:6px;width:380px;padding:15px 24px 14px}
.wmb .wh{font-size:25px;text-align:center;margin-bottom:2px}
.wmb .wl{display:flex;justify-content:space-between;gap:14px;font:800 18px/1.1 'Overpass',sans-serif;letter-spacing:.05em;color:#e3c87e;text-transform:uppercase;text-shadow:0 -1px 0 rgba(0,0,0,.72),0 1px 0 rgba(255,232,170,.16)}
.wmb .wb+.wb::before{display:none}
/* the treeline warning sign */
.wmstop{width:410px}
.wmstop .sb{position:relative;display:block;width:410px;padding:16px 26px 15px;text-align:center;border-radius:5px;color:#2a1c0c;font-family:'Overpass',sans-serif;
  background:radial-gradient(ellipse 60px 14px at 76% 82%,rgba(70,40,0,.28),transparent 70%),radial-gradient(ellipse 30px 10px at 12% 20%,rgba(70,40,0,.22),transparent 70%),repeating-linear-gradient(178.8deg,rgba(255,250,220,.08) 0 2px,rgba(0,0,0,.05) 2px 3px,transparent 3px 10px),linear-gradient(180deg,#eec233,#dfae22 55%,#cf9e19);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 -3px 5px rgba(80,50,0,.35),0 8px 14px rgba(0,0,0,.45)}
.wmstop .sb>*{display:block;text-shadow:0 1px 0 rgba(255,244,190,.55),0 -1px 0 rgba(0,0,0,.3);text-transform:uppercase}
.wmstop .s1{font:900 66px/.95 'Overpass',sans-serif;letter-spacing:.08em}
.wmstop .s2{margin-top:9px;font:800 16.5px/1.3 'Overpass',sans-serif;letter-spacing:.02em}
.wmstop .s3{margin-top:7px;font:800 16.5px/1.3 'Overpass',sans-serif;letter-spacing:.02em}
.wmstop .s4{margin-top:11px;font:800 11.5px/1 'Overpass',sans-serif;letter-spacing:.2em}
.wmstop .posts{display:flex;justify-content:space-between;width:300px;margin-top:-1px}
.wmstop .posts i{display:block;width:30px;height:190px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 1px,transparent 1px 5px),linear-gradient(90deg,#4b3f31,#7a6752 45%,#463a2c);-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
.oncairn .posts i{height:96px;-webkit-mask-image:none;mask-image:none}
/* junction (the fork) */
.wmj{width:430px}
.wmj.show .wjb{pointer-events:auto}
.wmj .jbs{position:relative;display:flex;flex-direction:column;gap:9px;align-items:center}
.wmj .jbs::before{top:-18px;bottom:0;height:auto}
.wjb{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:13px;width:410px;min-height:78px;padding:10px 18px;border:0;cursor:pointer;text-align:left;font-family:'Overpass',sans-serif;color:#ebd086;pointer-events:none;transition:filter .2s,transform .2s}
.wjb.r{grid-template-columns:1fr auto auto}
.wjb .jt{font-size:25px}
.wjb .js{display:block;margin-top:5px;font:700 11.5px/1.2 'Overpass',sans-serif;letter-spacing:.06em;color:#dcc27c;text-transform:uppercase;text-shadow:0 -1px 0 rgba(0,0,0,.7)}
.wjb .jn{font:800 21px/1 'Overpass',sans-serif;text-shadow:0 -1px 0 rgba(0,0,0,.72),0 1px 0 rgba(255,232,170,.2)}

<script>

/* =====================================================================

const V={};

/* =====================================================================

let cur=null,panelOpen=false,panelOpener=null,toastT=0;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function panelHTML(p){
  const br=BR[p.br]||{n:'',c:'#888'},chips=(p.stack||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join('');
  const award=p.wip?'<div class="p-award wip">'+esc(p.award||'⚠ Trail work ahead')+'</div>':p.award?'<div class="p-award"><span class="ros">★</span><span>'+esc(p.award)+'</span></div>':'';

   +'<div class="p-kick"><i style="background:'+br.c+'"></i>'+esc(br.n)+(p.small?' · side trail':'')+(p.dist&&!p.small?' · '+esc(p.dist):'')+'</div>'
   +'<h3 id="pTitle">'+esc(p.title)+'</h3>'+award
   +(p.one?'<p class="p-one">'+esc(p.one)+'</p>':'')

function hasShot(p){return !!(p&&p.shot&&p.shot.src&&p.public!==false);}

function trapTab(e){const f=$$('button,[href],[tabindex]:not([tabindex="-1"])',$('#pCard'));if(!f.length)return;const a=f[0],b=f[f.length-1];

/* the secret: the owl starts a headlamp night hike */
function setPill(){}

/* jumping to a sign = asking the shell for one of our anchors */
let ANCH={};
function jump(name){if(ANCH[name]==null)return;if(Climb.embedded)Climb.goto('trail',name);else window.postMessage({climb:1,type:'progress',p:ANCH[name]},'*');}
function buildDock(v){
  const d=document.createElement('div');d.className='dock';d.setAttribute('role','group');d.setAttribute('aria-label','Trail position');

  v.el.appendChild(d);v.dockEl=d;
  $('.prev',d).addEventListener('click',()=>{let j=-1;for(let i=0;i<v.spos.length;i++)if(v.spos[i]<v.pos-.004)j=i;jump(j<0?v.anames[0]:v.anames[j]);});
  $('.next',d).addEventListener('click',()=>{let j=-1;for(let i=0;i<v.spos.length;i++)if(v.spos[i]>v.pos+.004){j=i;break;}jump(j<0?v.anames[v.anames.length-1]:v.anames[j]);});

const OWL_SVG='<svg class="cbody" viewBox="0 0 100 130" aria-hidden="true"><path d="M50 124C24 124 15 96 18 66 21 42 31 24 50 24s29 18 32 42c3 30-6 58-32 58z" fill="#5d5742"/><path d="M24 36 20 8 42 26zM76 36 80 8 58 26z" fill="#4d4836"/><ellipse cx="50" cy="52" rx="31" ry="25" fill="#867f66"/><path d="M32 80q18 16 36 0 5 26-18 36-23-10-18-36z" fill="#b2aa8c"/><path d="M38 88q12 6 24 0M36 98q14 7 28 0M40 108q10 5 20 0" stroke="#6d6650" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M45 58h10l-5 11z" fill="#d6a23a"/><path d="M38 122l-4 8h10zM62 122l4 8H56z" fill="#c9a03a"/></svg>'

const BEAR_SVG='<svg class="cbody" viewBox="0 0 140 150" aria-hidden="true"><ellipse cx="70" cy="130" rx="54" ry="44" fill="#74492a"/><circle cx="31" cy="48" r="17" fill="#74492a"/><circle cx="31" cy="48" r="8.5" fill="#c58f67"/><circle cx="109" cy="48" r="17" fill="#74492a"/><circle cx="109" cy="48" r="8.5" fill="#c58f67"/><ellipse cx="70" cy="80" rx="47" ry="42" fill="#8a5833"/><ellipse cx="42" cy="90" rx="9" ry="7" fill="#9a6640"/><ellipse cx="98" cy="90" rx="9" ry="7" fill="#9a6640"/><ellipse cx="70" cy="93" rx="22" ry="17" fill="#d6a977"/><ellipse cx="70" cy="85" rx="8.5" ry="6" fill="#2b1a11"/><path d="M70 91v7M70 98q-6 5-12 1M70 98q6 5 12 1" stroke="#2b1a11" stroke-width="2.4" fill="none" stroke-linecap="round"/>'

 +'<svg class="ceyes" viewBox="0 0 140 150" aria-hidden="true"><circle class="ei" cx="51" cy="74" r="6.2"/><circle class="ei" cx="89" cy="74" r="6.2"/><circle class="ep" cx="52.5" cy="72.5" r="2"/><circle class="ep" cx="90.5" cy="72.5" r="2"/></svg>';
function mkCrit(kind,parent,label,onClick){
  const d=document.createElement('div'); d.className='crit '+kind;
  d.innerHTML='<div class="cin"><button class="cbtn" type="button" aria-label="'+esc(label)+'"></button>'+(kind==='owl'?OWL_SVG:BEAR_SVG)+'</div>';
  parent.appendChild(d);
  const c={el:d,cin:d.firstChild,kind,t:0,off:Math.random()*4,hide:0,vis:false,x:0,y:0,w:0,h:0,cx:0,cy:0,key:''};

/* place a creature: x,y = top-left in stage px; w,h size; vis boolean */
function placeCrit(c,x,y,w,h,vis){
  if(!vis){if(c.vis){c.el.style.display='none';c.vis=false;}return;}
  if(!c.vis){c.el.style.display='block';c.vis=true;}
  c.x=x;c.y=y;c.w=w;c.h=h;c.cx=x+w/2;c.cy=y+h*.45;
  const s=c.el.style; s.width=w.toFixed(1)+'px'; s.height=h.toFixed(1)+'px'; s.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';

  const g=c.kind==='bear'?(e>.45&&c.pv>.25):(e>.45&&lit>.32);

}
/* bear peek timeline: hidden, slide out, hold, duck */
function bearP(c,dt){
  if(reduce)return .78;

  const ph=(c.t+c.off)%14;
  if(ph>8&&ph<8.8)return ease((ph-8)/.8);
  if(ph>=8.8&&ph<11.6)return 1;
  if(ph>=11.6&&ph<11.95)return 1-ease((ph-11.6)/.35);

/* position the bear so it emerges from beside a trunk. (tx,ty)=trunk edge at ground, side=+1 emerges to the right */
function placeBear(c,edgeX,groundY,size,side,p,vis){

  {const d=(owlO.z-cam)*DIR;if(DIR>0&&d>2.5&&d<55){const k=f/d,sx=W/2+(pathX(owlO.z)+owlO.x-.55-camX)*k,sy=hy-(gz(owlO.z)+4.35-camY)*k+slopeAt(owlO.z/MZ)*owlO.x*k,hh=.82*k,ww=hh*.77;placeCrit(owl,sx-ww/2,sy-hh*.94,ww,hh,true);}else placeCrit(owl,0,0,0,0,false);}
  lightCrit(v,bear);lightCrit(v,owl);
  paintDark(v);WM.dock(v,mi,isG?2:1);updateRing(v,ring,owl);
  const zn=zoneName(mi);WM.hud(v,hud,zn[0],zn[1],mi);
  let cd=null;for(const q of CARDS)if(mi>q.a&&mi<q.b){cd=q;break;}WM.card(card,cd);
  /* the sign you're standing at, as a readable card: title + one line; the full board opens on click */
  {let b=-1,bd=9;for(let i=0;i<v.spos.length;i++){const d=Math.abs(v.spos[i]-v.pos);if(d<bd){bd=d;b=i;}}
   const gap=Math.min(b>0?v.spos[b]-v.spos[b-1]:1,b<v.spos.length-1?v.spos[b+1]-v.spos[b]:1);
   const p=v.stopP&&v.stopP[b]&&bd<gap*.28&&!(TURN>.03&&TURN<.97)?v.stopP[b]:null;
   if(scard._p!==p){scard._p=p;if(p){scard.innerHTML='<small>'+esc(BRN[p.branch]||'')+(p.award?' · '+esc(p.award):'')+'</small><b>'+esc(p.title)+'</b><span>'+esc(p.one||'')+'</span><em>Read the sign →</em>';scard.setAttribute('aria-label','Open '+p.title);}
     scard.classList.toggle('on',!!p);scard.tabIndex=p?0:-1;}}
};
v.hint=function(){v.hintT=4.2;v.target=clamp((owlO.z-13-camStart)/(camEnd-camStart),0,1);v.dirty=true;
  toast('Hint: just past Gem Pool, in the spruce-fir: a dead grey snag on the right has two round eyes.');};
}
/* =====================================================================
   The walk, built from CONTENT: trailhead → junction → Wins → Co-ops →
   Gem Pool → Projects → side trails → trail work → treeline STOP sign →
   outlook back down the ravine → hut junction → the hut door.
   Positions are real Ammonoosuc miles; the camera dwells at each stop and
   moves briskly between them (keyframed), so the stop lasts ~5 screens.
   ===================================================================== */
const GX=(function(){
  const main=PROJ.filter(p=>!p.small&&!p.wip),wip=PROJ.filter(p=>p.wip),small=PROJ.filter(p=>p.small);
  const st=[{t:'th',mi:.035,side:1,anchor:'trailhead',name:'Trailhead'},{t:'fork',mi:1.0,side:-1,anchor:'junction',name:'Junction'}];
  let side=1;
  const lower=['wins','coop'].flatMap(k=>main.filter(p=>p.branch===k));
  const s1=Math.min(.085,(1.98-1.08)/Math.max(1,lower.length-1));
  lower.forEach((p,i)=>{st.push({t:'it',id:p.id,mi:1.08+i*s1,side});side=-side;});
  st.push({t:'view',id:'gem',anchor:'gempool',mi:2.1,cam:9,name:'Outlook: Gem Pool'});
  const upper=main.filter(p=>p.branch!=='wins'&&p.branch!=='coop'),n2=upper.length+(small.length?1:0),s2=Math.min(.09,(2.52-2.18)/Math.max(1,n2-1));
  upper.forEach((p,i)=>{st.push({t:'it',id:p.id,mi:2.18+i*s2,side});side=-side;});
  if(small.length){st.push({t:'small',ids:small.map(p=>p.id),mi:2.18+upper.length*s2,side,anchor:'sidetrails',name:'Side trails'});side=-side;}
  wip.forEach((p,i)=>st.push({t:'it',id:p.id,mi:2.63+i*.06,side:1}));
  st.push({t:'stop',mi:2.84,side:-1,anchor:'treeline',name:'Treeline'});
  st.push({t:'view',id:'ravine',anchor:'outlook',mi:2.965,cam:0,turn:1,name:'Outlook: back down the ravine'});
  st.push({t:'hut',mi:3.045,side:-1,anchor:'hutjunction',name:'Crawford Path junction'});
  st.push({t:'end',mi:3.1,cam:10.5,anchor:'hut',name:'Lakes of the Clouds Hut'});
  const names=Object.values(BRN).join(', ');
  const cards=[
    {a:-.06,b:.14,t:'Ammonoosuc Ravine Trail',d:'From the Base Road lot near the Cog Railway: easy miles beside the Ammonoosuc River, then steep ledges to Lakes of the Clouds Hut at 3.1 mi.'},
    {a:.93,b:1.05,t:'Junction · 1.0 mi',d:'The real trail meets the link from the Cog Railway base station here. This one splits three ways: '+names+'. Walk on to see them all, or take an arrow.'},
    {a:2.05,b:2.13,t:'Outlook · Gem Pool · 3,450 ft',d:'A 35-foot cascade into a clear green pool on the Ammonoosuc. From here the trail turns steep.'},
    {a:2.77,b:2.9,t:'Treeline · about 4,600 ft',d:'The last stunted fir and black spruce, pruned flat by wind and ice. The STOP sign is real: it stands where trails leave the trees all over the Presidentials. Cairns and blue paint from here.'},
    {a:2.93,b:3.0,t:'Outlook · the Ammonoosuc Ravine',d:'Looking back west: the ravine you climbed, dark with spruce-fir, and Bretton Woods far below with the white Mount Washington Hotel and its red roofs.'},
    {a:3.02,b:3.3,t:'Lakes of the Clouds Hut · 5,012 ft',d:'Mt. Monroe on the right, the summit cone of Washington in its cloud cap on the left. The door is open.'}];
  return{cap:'',stops:st,cards};
})();

/* ---- boot ---- */
forestWalk('G',GX);
cur=V.G;cur.el.classList.add('on');
let started=false,running=true;
function start(){if(started)return;started=true;cur.build();cur.built=true;cur.resize();cur.dirty=true;requestAnimationFrame(loop);}
Climb.onProgress(p=>{cur.target=p;if(reduce)cur.pos=p;cur.dirty=true;});
Climb.onVisible(v=>{running=v;if(v)start();});
Climb.onTransition(m=>{const o=m.dir==='in'?m.t:1-m.t;document.documentElement.style.setProperty('--ui',clamp(o,0,1).toFixed(2));});
new ResizeObserver(()=>{if(cur.built){cur.resize();cur.dirty=true;}}).observe($('#stage'));
let lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(running&&cur.built&&!document.hidden){try{cur.frame(dt);}catch(err){if(!loop.err){loop.err=1;console.error(err);}}}
  requestAnimationFrame(loop);}
if(Climb.visible!==false)(document.readyState==='complete'?start():addEventListener('load',start));

</script>
